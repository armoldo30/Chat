name: Persist 1.19.2 Tank Upgrade Fix v2
on:
  push:
    branches: [audit-1.19.2]
    paths: ['.github/workflows/audit-tank-upgrades-v2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Apply source-defined NSB upgrade formulas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/tank.js');s=p.read_text()
          old="""const UPGRADE_STAT_MAP={soft_attack:'softAttack',hard_attack:'hardAttack',ap_attack:'piercing',armor_value:'armor',defense:'defense',breakthrough:'breakthrough',maximum_speed:'maxSpeed',reliability:'reliability',fuel_consumption:'fuelConsumption',build_cost_ic:'buildCost',air_attack:'airAttack'};
          function applyPackUpgrade(state,id,requested){
            const def=PACK_UPGRADES?.[id]?.raw||PACK_UPGRADES?.[id];if(!def||typeof def!=='object')return;
            const max=Number(def.max_level);const level=clamp(Math.round(Number(requested)||0),0,Number.isFinite(max)?max:20);if(!level)return;
            for(const [rawKey,dst] of Object.entries(UPGRADE_STAT_MAP)){
              const per=Number(def[rawKey]);if(!Number.isFinite(per))continue;
              state[dst]=(Number(state[dst])||0)*(1+per*level);
            }
          }
          """
          new="""const UPGRADE_STAT_MAP={soft_attack:'softAttack',hard_attack:'hardAttack',ap_attack:'piercing',armor_value:'armor',defense:'defense',breakthrough:'breakthrough',maximum_speed:'maxSpeed',reliability:'reliability',fuel_consumption:'fuelConsumption',build_cost_ic:'buildCost',air_attack:'airAttack'};
          const upgradeRaw=id=>PACK_UPGRADES?.[id]?.raw||PACK_UPGRADES?.[id];
          function numericLevelMap(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{}};
          export function applyTankUpgradeDefinition(state,def0,requested){
            const def=def0?.raw||def0;if(!def||typeof def!=='object')return 0;
            const max=Number(def.max_level);const level=clamp(Math.round(Number(requested)||0),0,Number.isFinite(max)?max:20);if(!level)return 0;
            for(const [rawKey,dst] of Object.entries(UPGRADE_STAT_MAP)){
              const per=Number(def[rawKey]);if(!Number.isFinite(per))continue;
              state[dst]=(Number(state[dst])||0)*(1+per*level);
            }
            for(const [rawKey,value] of Object.entries(numericLevelMap(def.add_stats))){
              const dst=UPGRADE_STAT_MAP[rawKey],per=Number(value);if(!dst||!Number.isFinite(per))continue;
              state[dst]=(Number(state[dst])||0)+per*level;
            }
            const thresholds=numericLevelMap(def.resource_cost_thresholds),eligible=Object.keys(thresholds).map(Number).filter(x=>Number.isFinite(x)&&x<=level).sort((a,b)=>a-b);
            if(eligible.length){
              const resources=numericLevelMap(thresholds[String(eligible.at(-1))]??thresholds[eligible.at(-1)]);state.resources={...(state.resources||{})};
              for(const [resource,value] of Object.entries(resources)){const q=Number(value);if(Number.isFinite(q))state.resources[resource]=(Number(state.resources[resource])||0)+q;}
            }
            return level;
          }
          function applyPackUpgrade(state,id,requested){return applyTankUpgradeDefinition(state,upgradeRaw(id),requested);}
          function tankUpgradeId(kind){const nsb=`tank_nsb_${kind}_upgrade`,legacy=`tank_${kind}_upgrade`;return upgradeRaw(nsb)?nsb:legacy;}
          """
          if old not in s: raise SystemExit('upgrade block not found')
          s=s.replace(old,new,1)
          oldcall="applyPackUpgrade(state,'tank_engine_upgrade',d.engineUpgrades);applyPackUpgrade(state,'tank_armor_upgrade',d.armorUpgrades);"
          if oldcall not in s: raise SystemExit('upgrade calls not found')
          s=s.replace(oldcall,"applyPackUpgrade(state,tankUpgradeId('engine'),d.engineUpgrades);applyPackUpgrade(state,tankUpgradeId('armor'),d.armorUpgrades);",1)
          p.write_text(s)

          Path('tests/tank-upgrade-certification.test.mjs').write_text("""import assert from 'node:assert/strict';
          import BUILTIN from '../src/builtin1192.js';
          import { configureTankDataPack, defaultTankDesign, buildTankDesign, applyTankUpgradeDefinition } from '../src/tank.js';
          const close=(a,b,msg)=>assert.ok(Math.abs(a-b)<1e-9,`${msg}: ${a} != ${b}`);
          const engine=BUILTIN.equipmentUpgrades?.tank_nsb_engine_upgrade?.raw||BUILTIN.equipmentUpgrades?.tank_nsb_engine_upgrade;
          const armor=BUILTIN.equipmentUpgrades?.tank_nsb_armor_upgrade?.raw||BUILTIN.equipmentUpgrades?.tank_nsb_armor_upgrade;
          assert.ok(engine&&armor,'bundled 1.19.2 pack must contain NSB tank upgrade definitions');
          assert.equal(Number(engine.max_level),20);assert.equal(Number(armor.max_level),20);
          assert.equal(Number(engine.reliability),-.015);assert.deepEqual(engine.add_stats,{fuel_consumption:.05,build_cost_ic:.1,maximum_speed:.1});
          assert.equal(Number(armor.reliability),-.015);assert.deepEqual(armor.add_stats,{maximum_speed:-.1,breakthrough:1.25,build_cost_ic:.2,armor_value:2.5});
          const eState={reliability:.8,maxSpeed:5,fuelConsumption:2,buildCost:10,resources:{steel:2}};assert.equal(applyTankUpgradeDefinition(eState,engine,10),10);close(eState.reliability,.68,'engine reliability');close(eState.maxSpeed,6,'engine speed');close(eState.fuelConsumption,2.5,'engine fuel');close(eState.buildCost,11,'engine cost');
          const aState={reliability:.8,maxSpeed:5,breakthrough:10,armor:30,buildCost:10,resources:{steel:2}};assert.equal(applyTankUpgradeDefinition(aState,armor,5),5);close(aState.reliability,.74,'armor reliability');close(aState.maxSpeed,4.5,'armor speed');close(aState.breakthrough,16.25,'armor breakthrough');close(aState.armor,42.5,'armor value');close(aState.buildCost,11,'armor cost');assert.equal(aState.resources.steel,3);
          const a15={reliability:.8,maxSpeed:5,breakthrough:10,armor:30,buildCost:10,resources:{steel:2}};applyTankUpgradeDefinition(a15,armor,15);assert.equal(a15.resources.steel,3,'resource thresholds are total, not cumulative');
          configureTankDataPack(BUILTIN,1940);const d=defaultTankDesign('medium'),base=buildTankDesign({...d,engineUpgrades:0,armorUpgrades:0}),e20=buildTankDesign({...d,engineUpgrades:20,armorUpgrades:0});close(e20.maxSpeed,base.maxSpeed+2,'20 NSB engine levels remain usable in theorycraft mode');close(e20.fuelConsumption,base.fuelConsumption+1,'20 NSB engine levels add source fuel cost');close(e20.buildCost,base.buildCost+2,'20 NSB engine levels add source IC');
          console.log('1.19.2 NSB tank upgrade formulas certified.');
          """)
          p=Path('package.json');s=p.read_text();needle='node tests/tank-module-source-certification.test.mjs && node tests/bundle-integrity.test.mjs'
          if 'tank-upgrade-certification.test.mjs' not in s:
            if needle not in s: raise SystemExit('package insertion point missing')
            s=s.replace(needle,'node tests/tank-module-source-certification.test.mjs && node tests/tank-upgrade-certification.test.mjs && node tests/bundle-integrity.test.mjs',1)
          p.write_text(s)
          PY
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated upgrade fix
        shell: bash
        run: |
          rm -f .github/workflows/audit-tank-upgrades.yml .github/workflows/audit-tank-upgrades-v2.yml .github/workflows/audit-tank-role-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use 1.19.2 NSB tank upgrades'
          git push origin HEAD:audit-1.19.2
