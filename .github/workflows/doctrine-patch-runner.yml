name: Doctrine patch runner

on:
  push:
    branches: [audit-1.19.2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
          fetch-depth: 0
      - name: Apply doctrine patch
        run: python scripts/doctrine-certify-patch.py
      - name: Commit doctrine patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/builtin1192.js src/doctrine.js tests/doctrine-effect-coverage.test.mjs tests/doctrine-runtime-certification.test.mjs package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: complete doctrine source/runtime certification"
          git push origin HEAD:audit-1.19.2
