name: Gauntlet Fidelity Patcher
on:
  push:
    branches: [gauntlet-1.19.2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gauntlet-1.19.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch opponent-side baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gauntlet.js');s=p.read_text()
          old="export async function runGauntlet({candidate,data,equipment,baseOpts,count=500,terrainKeys=GAUNTLET_TERRAINS,stochasticRuns=50,onProgress=null}){\n  const pool=generateOpponentPool(count,{battalions:data.battalions,supports:data.supports,equipment}),terrains=terrainKeys.filter(k=>baseOpts.terrainData?.[k]);"
          new="export async function runGauntlet({candidate,data,equipment,opponentData=null,opponentEquipment=null,candidateEquipment=null,baseOpts,count=500,terrainKeys=GAUNTLET_TERRAINS,stochasticRuns=50,onProgress=null}){\n  const od=opponentData||data,oe=opponentEquipment||equipment,ce=candidateEquipment||equipment,pool=generateOpponentPool(count,{battalions:od.battalions,supports:od.supports,equipment:oe}),terrains=terrainKeys.filter(k=>baseOpts.terrainData?.[k]);"
          assert old in s;s=s.replace(old,new,1)
          old2="candidateCost=divisionEquipmentIC(candidate.need||{},equipment||{}),medianCost"
          assert old2 in s;s=s.replace(old2,"candidateCost=divisionEquipmentIC(candidate.need||{},ce||{}),medianCost",1)
          p.write_text(s)
          p=Path('src/gauntlet-ui.js');s=p.read_text()
          old="const side=selectedSide,count=mode==='full'?10000:500,data=api.data(side),equipment=api.equipment(side),candidate=api.stats(side),baseOpts=api.battleOpts();\n      const result=await runGauntlet({candidate,data,equipment,baseOpts,count,stochasticRuns:mode==='full'?60:40,onProgress:p=>{"
          new="const side=selectedSide,count=mode==='full'?10000:500,opponentSide=side==='attacker'?'defender':'attacker',data=api.data(opponentSide),opponentEquipment=api.equipment(opponentSide),candidateEquipment=api.equipment(side),candidate=api.stats(side),baseOpts=api.battleOpts();\n      const result=await runGauntlet({candidate,opponentData:data,opponentEquipment,candidateEquipment,data,equipment:opponentEquipment,baseOpts,count,stochasticRuns:mode==='full'?60:40,onProgress:p=>{"
          assert old in s;s=s.replace(old,new,1);p.write_text(s)
          PY
      - name: Gauntlet tests
        run: node tests/gauntlet.test.mjs
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          if git diff --quiet -- src/gauntlet.js src/gauntlet-ui.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gauntlet.js src/gauntlet-ui.js
          git commit -m "fix: baseline Gauntlet opponents from opposite side"
          git push origin HEAD:gauntlet-1.19.2
