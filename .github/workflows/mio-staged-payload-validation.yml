name: MIO staged payload validation
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staged compressed payload
        run: |
          cat .mio-stage/part-* > /tmp/mio-payload.b64
          base64 -d /tmp/mio-payload.b64 > /tmp/mio-payload.xz
          xz -t /tmp/mio-payload.xz
          xz -dc /tmp/mio-payload.xz > /tmp/mio-patch.py
          python -m py_compile /tmp/mio-patch.py
          echo "PAYLOAD_BYTES=$(wc -c < /tmp/mio-patch.py)"
          echo "PAYLOAD_SHA256=$(sha256sum /tmp/mio-patch.py | cut -d' ' -f1)"
          head -n 3 /tmp/mio-patch.py
          tail -n 5 /tmp/mio-patch.py
