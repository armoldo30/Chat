name: Saved Matchup Library Patcher

on:
  push:
    branches: [saved-matchup-library]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore: run saved matchup integration'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saved-matchup-library
          fetch-depth: 0
      - name: Apply saved matchup integration
        run: python3 scripts/apply-saved-matchup-library.py
      - name: Remove patch helpers and commit integration
        run: |
          git rm .github/workflows/saved-matchup-patcher.yml scripts/apply-saved-matchup-library.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js index.html
          git commit -m "feat: add named saved matchup library"
          git push origin HEAD:saved-matchup-library
