name: Persist Tank Structural Audit Fixes
on:
  push:
    branches: [audit-1.19.2]
    paths:
      - '.github/workflows/audit-tank-structural-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source-structural Tank Designer fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'pattern missing in {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          # Parser: preserve module-driven slot categories and exact-match role restrictions.
          p=Path('src/parser.js'); s=p.read_text()
          marker="function cloneRecord(value){"
          helper="""function plainCategoryMap(v){
            const out={};
            for(const [slotId,cats] of Object.entries(obj(last(v))))if(slotId!=='__items')out[slotId]=items(cats);
            return out;
          }
          function plainScalarMap(v){
            const out={};
            for(const [key,value] of Object.entries(obj(last(v))))if(key!=='__items')out[key]=String(last(value));
            return out;
          }

          """
          if 'function plainCategoryMap(v)' not in s:
              s=s.replace(marker,helper+marker,1)
          old="out[id]={id,category:last(raw.category),guiCategory:last(raw.gui_category),parent:last(raw.parent),addStats:plainNeed(raw.add_stats),multiplyStats:plainNeed(raw.multiply_stats),addAverageStats:plainNeed(raw.add_average_stats),resources:plainNeed(raw.build_cost_resources),allowEquipmentType:items(raw.allow_equipment_type),forbidEquipmentType:items(raw.forbid_equipment_type),addEquipmentType:items(raw.add_equipment_type),xpCost:num(last(raw.xp_cost)),raw:plainMap(raw)};"
          new="out[id]={id,category:last(raw.category),guiCategory:last(raw.gui_category),parent:last(raw.parent),addStats:plainNeed(raw.add_stats),multiplyStats:plainNeed(raw.multiply_stats),addAverageStats:plainNeed(raw.add_average_stats),resources:plainNeed(raw.build_cost_resources),allowEquipmentType:items(raw.allow_equipment_type),forbidEquipmentType:items(raw.forbid_equipment_type),addEquipmentType:items(raw.add_equipment_type),allowedModuleCategories:plainCategoryMap(raw.allowed_module_categories),forbidEquipmentTypeExactMatch:items(raw.forbid_equipment_type_exact_match),forbidEquipmentTypeExactMatchForCategory:plainScalarMap(raw.forbid_equipment_type_exact_match_for_category),xpCost:num(last(raw.xp_cost)),raw:plainMap(raw)};"
          if old not in s: raise SystemExit('equipment-module extractor pattern missing')
          p.write_text(s.replace(old,new,1))

          # Built-in pack: merge compatibility-only source metadata into restored standard tank modules.
          p=Path('src/builtin1192.js'); s=p.read_text()
          imp="import tankModuleCompatibility1192 from './builtin1192/tank-module-compatibility-1192.js';\n"
          if imp not in s:
              s=s.replace("import tankModuleRequirements from './builtin1192/tank-module-requirements.js';\n", "import tankModuleRequirements from './builtin1192/tank-module-requirements.js';\n"+imp,1)
          merge="""for(const [id,rule] of Object.entries(tankModuleCompatibility1192)){
            const module=BUILTIN_1192.modules?.[id];if(!module)continue;
            Object.assign(module,rule);
            module.raw={...(module.raw||{}),
              ...(rule.allowedModuleCategories?{allowed_module_categories:rule.allowedModuleCategories}:{}),
              ...(rule.forbidEquipmentTypeExactMatch?{forbid_equipment_type_exact_match:rule.forbidEquipmentTypeExactMatch}:{}),
              ...(rule.forbidEquipmentTypeExactMatchForCategory?{forbid_equipment_type_exact_match_for_category:rule.forbidEquipmentTypeExactMatchForCategory}:{}),
              ...(rule.forbidEquipmentType?{forbid_equipment_type:rule.forbidEquipmentType}:{})};
          }
          """
          anchor="BUILTIN_1192.equipment={...(BUILTIN_1192.equipment||{}),...landEquipment1192};\n"
          if 'tankModuleCompatibility1192))' not in s:
              s=s.replace(anchor,merge+anchor,1)
          s=s.replace("moduleSlotListsCertified:true,duplicateArchetypeCount", "moduleSlotListsCertified:true,tankModuleCompatibilityCertified:true,duplicateArchetypeCount")
          p.write_text(s)

          # Designer catalog: use exact tank module categories, not regex/name guesses that admit aircraft/LC modules.
          p=Path('src/designerData.js'); s=p.read_text()
          start=s.index('function tankModuleBucket(m){')
          end=s.index('function airModuleBucket(m){',start)
          strict="""const TANK_GUN_CATEGORIES=new Set(['tank_small_main_armament','tank_medium_main_armament','tank_heavy_main_armament','tank_super_heavy_main_armament','tank_flamethrower']);
          const TANK_TURRET_CATEGORIES=new Set(['tank_light_turret_type','tank_medium_turret_type','tank_heavy_turret_type','tank_super_heavy_turret_type','tank_modern_turret_type']);
          const TANK_SUSPENSION_CATEGORIES=new Set(['tank_suspension_type','tank_non_tracked_suspension_type']);
          const TANK_SPECIAL_CATEGORIES=new Set(['tank_special_module','tank_radio_module','tank_secondary_turret']);
          function tankModuleBucket(m){
            const c=String(m?.category||'');
            if(TANK_GUN_CATEGORIES.has(c))return 'guns';
            if(TANK_TURRET_CATEGORIES.has(c))return 'turrets';
            if(TANK_SUSPENSION_CATEGORIES.has(c))return 'suspensions';
            if(c==='tank_armor_type')return 'armorTypes';
            if(c==='tank_engine_type')return 'engines';
            if(TANK_SPECIAL_CATEGORIES.has(c))return 'specials';
            return null;
          }
          """
          s=s[:start]+strict+s[end:]
          p.write_text(s)

          # Tank model: normalize selections against the chosen chassis' real slots and turret-added gun categories.
          p=Path('src/tank.js'); s=p.read_text()
          old_default="""export function defaultTankDesign(cls='medium'){
            const c=['light','medium','heavy'].includes(cls)?cls:'medium',chassis=chassisDefault(c)||firstKey(TANK_CHASSIS);
            return {name:`${c[0].toUpperCase()+c.slice(1)} Tank`,class:c,chassis,gun:gunDefault(c)||firstKey(TANK_GUNS),turret:defaultModule(TANK_TURRETS,'three_man'),suspension:defaultModule(TANK_SUSPENSIONS,'torsion'),armorType:defaultModule(TANK_ARMOR_TYPES,'welded'),engine:defaultModule(TANK_ENGINES,'diesel'),engineUpgrades:PACK_MODE?0:3,armorUpgrades:PACK_MODE?0:3,specials:[defaultModule(TANK_SPECIALS,'none'),'none','none']};
          }

          export function normalizeTankDesign(raw,cls='medium'){
            const desired=['light','medium','heavy'].includes(raw?.class)?raw.class:cls,base=defaultTankDesign(desired),out={...base,...(raw||{})};
            if(!TANK_CHASSIS[out.chassis])out.chassis=base.chassis;
            out.class=TANK_CHASSIS[out.chassis]?.class||desired;
            if(!TANK_GUNS[out.gun])out.gun=gunDefault(out.class)||firstKey(TANK_GUNS);
            if(!TANK_TURRETS[out.turret])out.turret=defaultModule(TANK_TURRETS,'three_man');
            if(!TANK_SUSPENSIONS[out.suspension])out.suspension=defaultModule(TANK_SUSPENSIONS,'torsion');
            if(!TANK_ARMOR_TYPES[out.armorType])out.armorType=defaultModule(TANK_ARMOR_TYPES,'welded');
            if(!TANK_ENGINES[out.engine])out.engine=defaultModule(TANK_ENGINES,'diesel');
            out.engineUpgrades=clamp(Math.round(Number(out.engineUpgrades)||0),0,20);
            out.armorUpgrades=clamp(Math.round(Number(out.armorUpgrades)||0),0,20);
            out.specials=Array.from({length:3},(_,i)=>TANK_SPECIALS[out.specials?.[i]]?out.specials[i]:'none');
            out.name=String(out.name||TANK_CHASSIS[out.chassis]?.name||humanize(out.chassis)).slice(0,80);
            return out;
          }
          """
          new_default="""const list=v=>Array.isArray(v)?v:v==null?[]:[v];
          function chassisSlots(chassis){return chassis?._equipment?.moduleSlots||chassis?.moduleSlots||{};}
          function moduleSource(record){return record?._module||record||{};}
          function allowedCategories(chassis,slotId,selected=[]){
            const out=new Set(list(chassisSlots(chassis)?.[slotId]?.allowed_module_categories));
            for(const record of selected.filter(Boolean))for(const cat of list(moduleSource(record)?.allowedModuleCategories?.[slotId]))out.add(cat);
            return out;
          }
          function compatible(record,chassis,slotId,selected=[]){
            if(!record)return false;if(record.id==='none'||record.name==='Empty')return true;
            return allowedCategories(chassis,slotId,selected).has(moduleSource(record)?.category||record.category);
          }
          function compatibleIds(map,chassis,slotId,selected=[]){return new Set(Object.entries(map||{}).filter(([,record])=>compatible(record,chassis,slotId,selected)).map(([id])=>id));}
          function firstCompatible(map,chassis,slotId,selected=[],preferred=[]){
            const ids=compatibleIds(map,chassis,slotId,selected);
            for(const id of preferred)if(ids.has(id))return id;
            return [...ids][0]||null;
          }
          const preferredTurret={light:['tank_light_three_man_tank_turret','tank_light_two_man_tank_turret'],medium:['tank_medium_three_man_tank_turret','tank_medium_two_man_tank_turret'],heavy:['tank_heavy_three_man_tank_turret','tank_heavy_two_man_tank_turret']};
          const preferredGun={light:['tank_small_cannon','tank_auto_cannon','tank_heavy_machine_gun'],medium:['tank_medium_cannon','tank_small_cannon_2','tank_small_cannon'],heavy:['tank_heavy_cannon','tank_medium_cannon_2','tank_medium_cannon']};
          function packDefaults(c,chassis){
            const ch=TANK_CHASSIS[chassis];
            const turret=firstCompatible(TANK_TURRETS,ch,'turret_type_slot',[],preferredTurret[c]||[]);
            const selectedTurret=TANK_TURRETS[turret];
            const gun=firstCompatible(TANK_GUNS,ch,'main_armament_slot',[selectedTurret],preferredGun[c]||[]);
            const suspension=firstCompatible(TANK_SUSPENSIONS,ch,'suspension_type_slot');
            const armorType=firstCompatible(TANK_ARMOR_TYPES,ch,'armor_type_slot');
            const engine=firstCompatible(TANK_ENGINES,ch,'engine_type_slot');
            return {turret,gun,suspension,armorType,engine};
          }

          export function defaultTankDesign(cls='medium'){
            const c=['light','medium','heavy'].includes(cls)?cls:'medium',chassis=chassisDefault(c)||firstKey(TANK_CHASSIS);
            if(PACK_MODE){const m=packDefaults(c,chassis);return {name:`${c[0].toUpperCase()+c.slice(1)} Tank`,class:c,chassis,...m,engineUpgrades:0,armorUpgrades:0,specials:['none','none','none','none']};}
            return {name:`${c[0].toUpperCase()+c.slice(1)} Tank`,class:c,chassis,gun:gunDefault(c)||firstKey(TANK_GUNS),turret:defaultModule(TANK_TURRETS,'three_man'),suspension:defaultModule(TANK_SUSPENSIONS,'torsion'),armorType:defaultModule(TANK_ARMOR_TYPES,'welded'),engine:defaultModule(TANK_ENGINES,'diesel'),engineUpgrades:3,armorUpgrades:3,specials:[defaultModule(TANK_SPECIALS,'none'),'none','none','none']};
          }

          export function normalizeTankDesign(raw,cls='medium'){
            const desired=['light','medium','heavy'].includes(raw?.class)?raw.class:cls,base=defaultTankDesign(desired),out={...base,...(raw||{})};
            if(!TANK_CHASSIS[out.chassis]||TANK_CHASSIS[out.chassis]?.class!==desired)out.chassis=base.chassis;
            out.class=TANK_CHASSIS[out.chassis]?.class||desired;
            if(PACK_MODE){
              const ch=TANK_CHASSIS[out.chassis],defaults=packDefaults(out.class,out.chassis);
              if(!compatible(TANK_TURRETS[out.turret],ch,'turret_type_slot'))out.turret=defaults.turret;
              const turret=TANK_TURRETS[out.turret];
              if(!compatible(TANK_GUNS[out.gun],ch,'main_armament_slot',[turret]))out.gun=firstCompatible(TANK_GUNS,ch,'main_armament_slot',[turret],preferredGun[out.class]||[])||defaults.gun;
              if(!compatible(TANK_SUSPENSIONS[out.suspension],ch,'suspension_type_slot'))out.suspension=defaults.suspension;
              if(!compatible(TANK_ARMOR_TYPES[out.armorType],ch,'armor_type_slot'))out.armorType=defaults.armorType;
              if(!compatible(TANK_ENGINES[out.engine],ch,'engine_type_slot'))out.engine=defaults.engine;
              out.specials=Array.from({length:4},(_,i)=>{const id=out.specials?.[i]||'none';return id==='none'||compatible(TANK_SPECIALS[id],ch,`special_type_slot_${i+1}`)?id:'none';});
            }else{
              if(!TANK_GUNS[out.gun])out.gun=gunDefault(out.class)||firstKey(TANK_GUNS);
              if(!TANK_TURRETS[out.turret])out.turret=defaultModule(TANK_TURRETS,'three_man');
              if(!TANK_SUSPENSIONS[out.suspension])out.suspension=defaultModule(TANK_SUSPENSIONS,'torsion');
              if(!TANK_ARMOR_TYPES[out.armorType])out.armorType=defaultModule(TANK_ARMOR_TYPES,'welded');
              if(!TANK_ENGINES[out.engine])out.engine=defaultModule(TANK_ENGINES,'diesel');
              out.specials=Array.from({length:4},(_,i)=>TANK_SPECIALS[out.specials?.[i]]?out.specials[i]:'none');
            }
            out.engineUpgrades=clamp(Math.round(Number(out.engineUpgrades)||0),0,20);
            out.armorUpgrades=clamp(Math.round(Number(out.armorUpgrades)||0),0,20);
            out.name=String(out.name||TANK_CHASSIS[out.chassis]?.name||humanize(out.chassis)).slice(0,80);
            return out;
          }

          export function tankDesignOptions(raw){
            const c=TANK_CHASSIS[raw?.chassis]||TANK_CHASSIS[chassisDefault(raw?.class||'medium')]||TANK_CHASSIS[firstKey(TANK_CHASSIS)];
            if(!PACK_MODE){const all=map=>new Set(Object.keys(map));return {guns:all(TANK_GUNS),turrets:all(TANK_TURRETS),suspensions:all(TANK_SUSPENSIONS),armorTypes:all(TANK_ARMOR_TYPES),engines:all(TANK_ENGINES),specials:Array.from({length:4},()=>all(TANK_SPECIALS))};}
            const turret=TANK_TURRETS[raw?.turret];
            return {guns:compatibleIds(TANK_GUNS,c,'main_armament_slot',[turret]),turrets:compatibleIds(TANK_TURRETS,c,'turret_type_slot'),suspensions:compatibleIds(TANK_SUSPENSIONS,c,'suspension_type_slot'),armorTypes:compatibleIds(TANK_ARMOR_TYPES,c,'armor_type_slot'),engines:compatibleIds(TANK_ENGINES,c,'engine_type_slot'),specials:Array.from({length:4},(_,i)=>new Set(['none',...compatibleIds(TANK_SPECIALS,c,`special_type_slot_${i+1}`)]))};
          }
          """
          if old_default not in s: raise SystemExit('tank default/normalize block missing')
          p.write_text(s.replace(old_default,new_default,1))

          # UI: filter each selector by the current source-defined structural slot graph.
          p=Path('src/main.js'); s=p.read_text()
          s=s.replace("tankClassIds, configureTankDataPack, tankDataStatus } from './tank.js';", "tankClassIds, configureTankDataPack, tankDataStatus, tankDesignOptions } from './tank.js';")
          s=s.replace("function optionList(map,current,filter=()=>true){return Object.entries(map).filter(([,v])=>filter(v)).map", "function optionList(map,current,filter=()=>true){return Object.entries(map).filter(([k,v])=>filter(v,k)).map")
          s=s.replace("ensureTankState();const side=state.tankDesigner.side,cls=state.tankDesigner.class,raw=tankCurrent(),d=adjustedTankDesign(side,cls),ids=tankClassIds(cls),unit=techData(side).battalions[ids.battalion],eq=equipmentForSide(side)[ids.equipment],other=side==='attacker'?'defender':'attacker';", "ensureTankState();const side=state.tankDesigner.side,cls=state.tankDesigner.class,raw=tankCurrent(),choices=tankDesignOptions(raw),d=adjustedTankDesign(side,cls),ids=tankClassIds(cls),unit=techData(side).battalions[ids.battalion],eq=equipmentForSide(side)[ids.equipment],other=side==='attacker'?'defender':'attacker';")
          replacements={
            "${optionList(TANK_GUNS,raw.gun)}":"${optionList(TANK_GUNS,raw.gun,(v,k)=>choices.guns.has(k))}",
            "${optionList(TANK_TURRETS,raw.turret)}":"${optionList(TANK_TURRETS,raw.turret,(v,k)=>choices.turrets.has(k))}",
            "${optionList(TANK_SUSPENSIONS,raw.suspension)}":"${optionList(TANK_SUSPENSIONS,raw.suspension,(v,k)=>choices.suspensions.has(k))}",
            "${optionList(TANK_ARMOR_TYPES,raw.armorType)}":"${optionList(TANK_ARMOR_TYPES,raw.armorType,(v,k)=>choices.armorTypes.has(k))}",
            "${optionList(TANK_ENGINES,raw.engine)}":"${optionList(TANK_ENGINES,raw.engine,(v,k)=>choices.engines.has(k))}",
            "${optionList(TANK_SPECIALS,v)}":"${optionList(TANK_SPECIALS,v,(m,k)=>choices.specials[i].has(k))}"
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'main selector pattern missing {a}')
              s=s.replace(a,b,1)
          p.write_text(s)

          # Permanent structural certification tests.
          Path('tests/tank-designer-certification.test.mjs').write_text("""import assert from 'node:assert/strict';
          import BUILTIN from '../src/builtin1192.js';
          import { parseClausewitz, extractEquipmentModules } from '../src/parser.js';
          import { tankCatalogFromPack } from '../src/designerData.js';
          import { configureTankDataPack, defaultTankDesign, normalizeTankDesign, tankDesignOptions } from '../src/tank.js';

          assert.equal(BUILTIN.meta.tankModuleCompatibilityCertified,true);
          const cat=tankCatalogFromPack(BUILTIN);
          assert.equal(cat.meta.chassis,12);
          assert.equal(cat.meta.guns,25,'standard tank gun catalog must contain only tank armament categories');
          assert.ok(!cat.guns.aircraft_cannon_1_1x,'aircraft weapons must never leak into Tank Designer');
          assert.ok(!cat.guns.lc_medium_cannon_turret,'Land Cruiser modules use a separate slot family');
          assert.ok(cat.guns.tank_medium_cannon&&cat.guns.tank_heavy_cannon&&cat.guns.tank_super_heavy_cannon);

          const imported=extractEquipmentModules(parseClausewitz(`equipment_modules={ turret={ category=tank_medium_turret_type allowed_module_categories={ main_armament_slot={ tank_medium_main_armament tank_heavy_main_armament } } forbid_equipment_type_exact_match=armor forbid_equipment_type_exact_match_for_category={ tank_heavy_main_armament=armor } } }`));
          assert.deepEqual(imported.turret.allowedModuleCategories.main_armament_slot,['tank_medium_main_armament','tank_heavy_main_armament']);
          assert.deepEqual(imported.turret.forbidEquipmentTypeExactMatch,['armor']);
          assert.deepEqual(imported.turret.forbidEquipmentTypeExactMatchForCategory,{tank_heavy_main_armament:'armor'});

          assert.deepEqual(BUILTIN.modules.tank_medium_three_man_tank_turret.allowedModuleCategories.main_armament_slot,['tank_medium_main_armament']);
          assert.deepEqual(BUILTIN.modules.tank_heavy_fixed_superstructure_turret.allowedModuleCategories.main_armament_slot,['tank_medium_main_armament','tank_heavy_main_armament','tank_super_heavy_main_armament']);

          configureTankDataPack(BUILTIN,1940);
          const medium=defaultTankDesign('medium');
          assert.equal(medium.specials.length,4,'standard 1.19.2 chassis have four optional special slots');
          let opts=tankDesignOptions(medium);
          assert.ok(opts.guns.has('tank_medium_cannon'),'medium turret must add medium main-armament category');
          assert.ok(!opts.guns.has('tank_heavy_cannon'),'ordinary medium turret must not accept heavy armament');
          assert.equal(opts.specials.length,4);for(const set of opts.specials)assert.ok(set.has('none'));

          const light=defaultTankDesign('light');
          opts=tankDesignOptions(light);
          assert.ok(!opts.guns.has('tank_medium_cannon'));
          const lightFixed=normalizeTankDesign({...light,turret:'tank_light_fixed_superstructure_turret'},'light');
          assert.ok(tankDesignOptions(lightFixed).guns.has('tank_medium_cannon'),'light fixed superstructure adds medium armament category');
          const heavy=defaultTankDesign('heavy');
          const heavyFixed=normalizeTankDesign({...heavy,turret:'tank_heavy_fixed_superstructure_turret'},'heavy');
          assert.ok(tankDesignOptions(heavyFixed).guns.has('tank_super_heavy_cannon'),'heavy fixed superstructure adds super-heavy armament category');

          const invalid=normalizeTankDesign({...light,turret:'tank_heavy_three_man_tank_turret',gun:'tank_super_heavy_cannon'},'light');
          assert.notEqual(invalid.turret,'tank_heavy_three_man_tank_turret');
          assert.notEqual(invalid.gun,'tank_super_heavy_cannon');
          console.log('Tank Designer structural certification invariants passed.');
          """)
          p=Path('package.json'); s=p.read_text();
          needle='node tests/land-data-certification.test.mjs && node tests/bundle-integrity.test.mjs'
          if 'tank-designer-certification.test.mjs' not in s:
              if needle not in s: raise SystemExit('package test insertion pattern missing')
              s=s.replace(needle,'node tests/land-data-certification.test.mjs && node tests/tank-designer-certification.test.mjs && node tests/bundle-integrity.test.mjs',1)
          p.write_text(s)
          PY
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated structural fixes
        shell: bash
        run: |
          rm -f tests/tank-designer-probe.mjs .github/workflows/audit-tank-probe.yml .github/workflows/audit-tank-structural-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce source tank slot compatibility'
          git push origin HEAD:audit-1.19.2
