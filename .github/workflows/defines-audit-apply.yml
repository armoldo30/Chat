name: Apply Defines Audit
on:
  push:
    branches:
      - audit-1.19.2
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: retry defines integration helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
          fetch-depth: 0
      - name: Patch source and tests
        run: python3 scripts/apply-defines-audit.py
      - name: Commit permanent changes and remove helper
        run: |
          git rm .github/workflows/defines-audit-apply.yml scripts/apply-defines-audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.js src/parser.js src/builtin1192.js package.json
          git commit -m "audit: integrate bounded 1.19.2 defines"
          git push origin HEAD:audit-1.19.2
