name: Regimental Support Source Patcher
on:
  push:
    branches: ['regimental-support-0.16.5']

permissions:
  contents: write

concurrency:
  group: regimental-support-source-patcher
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[regimental-source-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: regimental-support-0.16.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source correction
        run: node scripts/regimental-support-source-patch.mjs
      - name: Full regression suite
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Commit corrected source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/parser.js src/gameData.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: apply regimental support source corrections [regimental-source-patched]"
          git push origin HEAD:regimental-support-0.16.5
