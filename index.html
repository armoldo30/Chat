<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111815" />
    <title>War Planner — HOI4</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <main id="app"></main>
    <script>
      try {
        const old = JSON.parse(localStorage.getItem('hoi4-war-planner') || 'null');
        if (old && !old.scenario) localStorage.removeItem('hoi4-war-planner');
      } catch (_) { localStorage.removeItem('hoi4-war-planner'); }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
