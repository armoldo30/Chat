name: Persist Full Tank Designer Audit
on:
  push:
    branches: [audit-1.19.2]
    paths: ['.github/workflows/audit-tank-family-implementation.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Apply family, role and Land Cruiser implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # designerData: include all source-backed designer chassis families and LC modules.
          p=Path('src/designerData.js');s=p.read_text()
          a=s.index('function tankClass(id,e){');b=s.index('function airSize(id,e){',a)
          family="""function tankFamily(id,e){
            if(e?.duplicateRole||e?.raw?.is_archetype===true)return null;
            const key=String(id||'').toLowerCase(),text=`${id} ${e?.archetype||''} ${(e?.types||[]).join(' ')}`.toLowerCase();
            if(/^land_cruiser_chassis_\\d+$/.test(key))return 'land_cruiser';
            if(/^amphibious_tank_chassis_\\d+$/.test(key))return 'amphibious';
            if(/^super_heavy_tank_chassis_\\d+$/.test(key))return 'super_heavy';
            if(/^modern_tank_chassis_\\d+$/.test(key))return 'modern';
            if(/light.*tank.*chassis|tank.*light.*chassis/.test(text))return 'light';
            if(/medium.*tank.*chassis|tank.*medium.*chassis/.test(text))return 'medium';
            if(/heavy.*tank.*chassis|tank.*heavy.*chassis/.test(text))return 'heavy';
            return null;
          }
          """
          s=s[:a]+family+s[b:]
          a=s.index('export function tankCatalogFromPack(pack){');b=s.index('export function airCatalogFromPack(pack){',a)
          catalog="""export function tankCatalogFromPack(pack){
            const out={chassis:{},guns:{},turrets:{},suspensions:{},armorTypes:{},engines:{},specials:{none:{id:'none',name:'Empty',source:'system',_module:null}},slotModules:{none:{id:'none',name:'Empty',source:'system',_module:null}}};
            for(const id of Object.keys(pack?.equipment||{})){
              const e=resolvedEquipment(pack,id),cls=tankFamily(id,e);if(!cls||!hasSlots(e))continue;
              out.chassis[id]=chassisRecord(id,e,cls,pack);
            }
            for(const m of Object.values(pack?.modules||{})){
              const bucket=tankModuleBucket(m);if(bucket)out[bucket][m.id]=moduleRecord(m,pack);
              if(String(m?.category||'').startsWith('lc_'))out.slotModules[m.id]=moduleRecord(m,pack);
            }
            const standardChassis=Object.values(out.chassis).filter(x=>['light','medium','heavy'].includes(x.class)).length;
            out.meta={chassis:Object.keys(out.chassis).length,standardChassis,extendedChassis:Object.keys(out.chassis).length-standardChassis,guns:Object.keys(out.guns).length,turrets:Object.keys(out.turrets).length,suspensions:Object.keys(out.suspensions).length,armorTypes:Object.keys(out.armorTypes).length,engines:Object.keys(out.engines).length,specials:Object.keys(out.specials).length-1,slotModules:Object.keys(out.slotModules).length-1};
            return out;
          }

          """
          p.write_text(s[:a]+catalog+s[b:])

          # Built-in 1.19.2: attach the source repeated module_count_limit blocks to both LC chassis records.
          p=Path('src/builtin1192.js');s=p.read_text()
          imp="import landCruiserCountLimits1192 from './builtin1192/land-cruiser-count-limits-1192.js';\n"
          if imp not in s:s=s.replace("import landEquipment1192 from './builtin1192/land-equipment-1192.js';\n","import landEquipment1192 from './builtin1192/land-equipment-1192.js';\n"+imp,1)
          anchor="materializeDuplicateArchetypes(BUILTIN_1192.equipment,BUILTIN_1192.duplicateArchetypes);\n"
          attach="""materializeDuplicateArchetypes(BUILTIN_1192.equipment,BUILTIN_1192.duplicateArchetypes);
          for(const id of ['land_cruiser_chassis','land_cruiser_chassis_1'])if(BUILTIN_1192.equipment?.[id])BUILTIN_1192.equipment[id].moduleCountLimits=landCruiserCountLimits1192.map(x=>({...x}));
          """
          if 'moduleCountLimits=landCruiserCountLimits1192' not in s:s=s.replace(anchor,attach,1)
          s=s.replace("landEquipmentSupplementCount:Object.keys(landEquipment1192).length", "landEquipmentSupplementCount:Object.keys(landEquipment1192).length,landCruiserCountLimitsCertified:true")
          p.write_text(s)

          # Tank runtime: retain fallback constants, replace the pack-aware implementation with the audited family implementation.
          p=Path('src/tank.js');s=p.read_text()
          if "import { resolveEquipment } from './parser.js';" not in s:s=s.replace("import { tankCatalogFromPack, equipmentToState, applyModuleEffects, chooseCatalogDefault } from './designerData.js';\n","import { tankCatalogFromPack, equipmentToState, applyModuleEffects, chooseCatalogDefault } from './designerData.js';\nimport { resolveEquipment } from './parser.js';\n",1)
          marker='const FALLBACK_DEFAULT_CHASSIS='
          if marker not in s:raise SystemExit('tank runtime marker missing')
          tail=Path('audit/tank-family-tail.js').read_text()
          s=s[:s.index(marker)]+tail+'\n'
          p.write_text(s)

          # Main app imports.
          p=Path('src/main.js');s=p.read_text()
          old="import { TANK_CHASSIS, TANK_GUNS, TANK_TURRETS, TANK_SUSPENSIONS, TANK_ARMOR_TYPES, TANK_ENGINES, TANK_SPECIALS, defaultTankDesign, normalizeTankDesign, buildTankDesign, applyTankDesignToBattalion, tankEquipmentRecord, tankClassIds, configureTankDataPack, tankDataStatus, tankDesignOptions } from './tank.js';"
          new="import { TANK_CHASSIS, TANK_GUNS, TANK_TURRETS, TANK_SUSPENSIONS, TANK_ARMOR_TYPES, TANK_ENGINES, TANK_SPECIALS, TANK_SLOT_MODULES, TANK_FAMILIES, TANK_ROLE_LABELS, defaultTankDesign, normalizeTankDesign, buildTankDesign, applyTankDesignToBattalion, tankEquipmentRecord, configureTankDataPack, tankDataStatus, tankDesignOptions, tankRolesForFamily, tankVariantTargets, tankMioFamily, tankFamilyLabel } from './tank.js';"
          if old not in s:raise SystemExit('main tank import missing')
          s=s.replace(old,new,1)
          s=s.replace("  tankDesigns:{attacker:{light:defaultTankDesign('light'),medium:defaultTankDesign('medium'),heavy:defaultTankDesign('heavy')},defender:{light:defaultTankDesign('light'),medium:defaultTankDesign('medium'),heavy:defaultTankDesign('heavy')}},\n  tankDesigner:{side:'attacker',class:'medium'},", "  tankDesigns:{attacker:{light:defaultTankDesign('light'),medium:defaultTankDesign('medium'),heavy:defaultTankDesign('heavy')},defender:{light:defaultTankDesign('light'),medium:defaultTankDesign('medium'),heavy:defaultTankDesign('heavy')}},\n  tankVariants:null,\n  tankDesigner:{side:'attacker',class:'medium',role:'armor'},",1)
          a=s.index('function ensureTankState(){');b=s.index('function ensureAirState(){',a)
          ensure="""function ensureTankState(){
            if(!state.tankDesigns||typeof state.tankDesigns!=='object')state.tankDesigns=structuredClone(defaults.tankDesigns);
            if(!state.tankVariants||typeof state.tankVariants!=='object')state.tankVariants={attacker:{},defender:{}};
            for(const side of ['attacker','defender']){
              state.tankDesigns[side]=state.tankDesigns[side]||{};state.tankVariants[side]=state.tankVariants[side]||{};
              for(const family of TANK_FAMILIES){
                state.tankVariants[side][family]=state.tankVariants[side][family]||{};
                for(const role of tankRolesForFamily(family)){
                  const legacy=role==='armor'&&['light','medium','heavy'].includes(family)?state.tankDesigns[side][family]:null;
                  const raw=state.tankVariants[side][family][role]||legacy||defaultTankDesign(family,role);
                  state.tankVariants[side][family][role]=normalizeTankDesign({...raw,class:family,role},family,role);
                }
                if(['light','medium','heavy'].includes(family))state.tankDesigns[side][family]=structuredClone(state.tankVariants[side][family].armor);
              }
            }
            const family=TANK_FAMILIES.includes(state.tankDesigner?.class)?state.tankDesigner.class:'medium',roles=tankRolesForFamily(family),role=roles.includes(state.tankDesigner?.role)?state.tankDesigner.role:roles[0];
            state.tankDesigner={side:['attacker','defender'].includes(state.tankDesigner?.side)?state.tankDesigner.side:'attacker',class:family,role};
          }
          function tankDesignFor(side,family,role='armor'){ensureTankState();return state.tankVariants[side][family][role]||state.tankVariants[side][family][tankRolesForFamily(family)[0]];}
          """
          s=s[:a]+ensure+s[b:]
          a=s.index('function applyFamilyMioToData(data,side){');b=s.index('function techProblems(side){',a)
          runtime="""function applyFamilyMioToData(data,side){
            const maps={infantry_equipment:{b:['infantry','motorized','mechanized','cavalry'],s:[]},artillery:{b:['artillery'],s:['support_artillery','regimental_infantry_guns']},anti_tank:{b:['anti_tank'],s:['support_at','regimental_at']},anti_air:{b:['anti_air'],s:['support_aa','regimental_aa']}};
            for(const [family,m] of Object.entries(maps)){const eff=mioEffectFor(side,family);for(const id of m.b)if(data.battalions[id])data.battalions[id]=applyMioEquipmentBonus(data.battalions[id],eff.equipmentBonus);for(const id of m.s)if(data.supports[id])data.supports[id]=applyMioEquipmentBonus(data.supports[id],eff.equipmentBonus);}
            for(const family of ['light','medium','heavy']){const mio=tankMioFamily(family),eff=mioEffectFor(side,mio);for(const role of tankRolesForFamily(family)){const target=tankVariantTargets(family,role);for(const u of target?.units||[]){const map=u.kind==='support'?data.supports:data.battalions;if(map[u.id])map[u.id]=applyMioEquipmentBonus(map[u.id],eff.equipmentBonus);}}}
            return data;
          }
          function adjustedTankDesign(side,family,role='armor'){const base=buildTankDesign(tankDesignFor(side,family,role)),mio=tankMioFamily(family);return mio?applyMioToVariant(base,mioEffectFor(side,mio)):base;}
          function adjustedAirDesign(side,raw){const base=buildAirDesign(raw),family=base.size==='large'?'large_airframe':base.size==='medium'?'medium_airframe':'small_airframe',withMio=applyMioToVariant(base,mioEffectFor(side,family));return applyAirDoctrineToVariant(withMio,ensureTechState(side).airDoctrine,state.dataPack);}
          function equipmentForSide(side='attacker'){
            ensureTankState();ensureMioState();const out=structuredClone(equipment);
            for(const family of ['infantry_equipment','artillery','anti_tank','anti_air'])if(out[family])out[family]=applyMioToEquipmentRecord(out[family],mioEffectFor(side,family));
            for(const family of TANK_FAMILIES)for(const role of tankRolesForFamily(family)){
              const target=tankVariantTargets(family,role),raw=tankDesignFor(side,family,role),base=buildTankDesign(raw),mio=tankMioFamily(family),eff=mio?mioEffectFor(side,mio):null,design=mio?applyMioToVariant(base,eff):base;
              for(const key of [target?.equipmentKey,...(target?.aliases||[])].filter(Boolean))if(out[key]){out[key]=mio?applyMioToEquipmentRecord(tankEquipmentRecord(out[key],raw),eff):tankEquipmentRecord(out[key],raw);out[key].designStats=design;}
            }
            return out;
          }
          function validRegimentalSupports(side){ensureDesignerState(side);return state[side+'RegimentalSupports'].filter((key,c)=>key&&filledInRegiment(state[side+'Grid'],c)>=3&&regimentalBaselineCompatible(side,c,key));}
          function syncDesignerSide(side){ensureDesignerState(side);state[side]=gridToCounts(state[side+'Grid'],Object.keys(battalions));}
          function techData(side){
            const data=buildTechAdjustedData(battalions,supports,ensureTechState(side),{pack:state.dataPack,year:state.dataSnapshotYear});ensureTankState();ensureMioState();
            for(const family of TANK_FAMILIES)for(const role of tankRolesForFamily(family)){const target=tankVariantTargets(family,role),raw=tankDesignFor(side,family,role);for(const u of target?.units||[]){const map=u.kind==='support'?data.supports:data.battalions;if(map[u.id])map[u.id]=applyTankDesignToBattalion(map[u.id],raw);}}
            return applyFamilyMioToData(data,side);
          }
          """
          s=s[:a]+runtime+s[b:]
          s=s.replace("document.querySelectorAll('[data-armor-link]').forEach(el=>el.onclick=()=>{state.tankDesigner.side=activeDesignerSide;state.tankDesigner.class=el.dataset.armorLink;save();});", "document.querySelectorAll('[data-armor-link]').forEach(el=>el.onclick=()=>{state.tankDesigner.side=activeDesignerSide;state.tankDesigner.class=el.dataset.armorLink;state.tankDesigner.role='armor';save();});",1)
          s=s.replace("function tankCurrent(){ensureTankState();return state.tankDesigns[state.tankDesigner.side][state.tankDesigner.class];}", "function tankCurrent(){ensureTankState();return tankDesignFor(state.tankDesigner.side,state.tankDesigner.class,state.tankDesigner.role);}",1)
          oldgrid="""function tankStatsGrid(d){
            const rows=[['Width',s.width,0]];"""
          # Replace by marker boundaries instead of relying on the old body.
          a=s.index('function tankStatsGrid(d){');b=s.index('function tank(c){',a)
          grid="""function tankStatsGrid(d){
            const rows=[['Soft Attack',d.softAttack,1],['Hard Attack',d.hardAttack,1],['Piercing',d.piercing,1],['Air Attack',d.airAttack||0,1],['Armor',d.armor,1],['Hardness',(d.hardness||0)*100,1,'%'],['Breakthrough',d.breakthrough,1],['Defense',d.defense,1],['Max Speed',d.maxSpeed,2,' km/h'],['Reliability',d.reliability*100,1,'%'],['Fuel Use',d.fuelConsumption,2],['IC Cost',d.buildCost,2]];
            return `<div class=\"tank-stat-grid\">${rows.map(([k,v,n,suf=''])=>`<div><span>${k}</span><b>${fmt(v,n)}${suf}</b></div>`).join('')}</div>`;
          }
          """
          s=s[:a]+grid+s[b:]
          a=s.index('function tank(c){');b=s.index('function renderAirDoctrine(side,prefix){',a)
          s=s[:a]+Path('audit/main-tank-function.js').read_text()+'\n\n'+s[b:]
          p.write_text(s)

          # Update structural tests to the expanded source graph.
          p=Path('tests/land-data-certification.test.mjs');s=p.read_text()
          s=s.replace("assert.equal(cat.meta.chassis,12,'designer catalog should contain four real year chassis for each supported light/medium/heavy class');", "assert.equal(cat.meta.chassis,16,'designer catalog includes 12 standard plus modern, super-heavy, dedicated amphibious and Land Cruiser chassis');assert.equal(cat.meta.standardChassis,12);assert.equal(cat.meta.extendedChassis,4);")
          p.write_text(s)

          Path('tests/tank-designer-certification.test.mjs').write_text("""import assert from 'node:assert/strict';
          import BUILTIN from '../src/builtin1192.js';
          import { parseClausewitz, extractEquipmentModules } from '../src/parser.js';
          import { tankCatalogFromPack } from '../src/designerData.js';
          import { configureTankDataPack, defaultTankDesign, normalizeTankDesign, tankDesignOptions } from '../src/tank.js';
          assert.equal(BUILTIN.meta.tankModuleCompatibilityCertified,true);
          const cat=tankCatalogFromPack(BUILTIN);assert.equal(cat.meta.chassis,16);assert.equal(cat.meta.standardChassis,12);assert.equal(cat.meta.extendedChassis,4);assert.ok(cat.chassis.modern_tank_chassis_1&&cat.chassis.super_heavy_tank_chassis_1&&cat.chassis.amphibious_tank_chassis_1&&cat.chassis.land_cruiser_chassis_1);assert.equal(cat.meta.guns,25);assert.ok(!cat.guns.aircraft_cannon_1_1x);assert.ok(!cat.guns.lc_medium_cannon_turret);assert.ok(cat.meta.slotModules>=25);
          const imported=extractEquipmentModules(parseClausewitz(`equipment_modules={ turret={ category=tank_medium_turret_type allowed_module_categories={ main_armament_slot={ tank_medium_main_armament tank_heavy_main_armament } } forbid_equipment_type_exact_match=armor forbid_equipment_type_exact_match_for_category={ tank_heavy_main_armament=armor } } }`));assert.deepEqual(imported.turret.allowedModuleCategories.main_armament_slot,['tank_medium_main_armament','tank_heavy_main_armament']);assert.deepEqual(imported.turret.forbidEquipmentTypeExactMatch,['armor']);assert.deepEqual(imported.turret.forbidEquipmentTypeExactMatchForCategory,{tank_heavy_main_armament:'armor'});
          configureTankDataPack(BUILTIN,1940);const medium=defaultTankDesign('medium','armor');assert.equal(medium.specials.length,4);let opts=tankDesignOptions(medium);assert.ok(opts.guns.has('tank_medium_cannon'));assert.ok(!opts.guns.has('tank_heavy_cannon'));assert.equal(opts.specials.length,4);
          const light=defaultTankDesign('light','armor'),lightFixed=normalizeTankDesign({...light,turret:'tank_light_fixed_superstructure_turret',gun:'tank_medium_cannon'},'light','armor');assert.ok(!tankDesignOptions(lightFixed).guns.has('tank_medium_cannon'),'oversized fixed-superstructure gun is not legal for pure armor role');
          const lightTD=normalizeTankDesign({...defaultTankDesign('light','anti_tank'),turret:'tank_light_fixed_superstructure_turret',gun:'tank_medium_cannon'},'light','anti_tank');assert.ok(tankDesignOptions(lightTD).guns.has('tank_medium_cannon'),'same source structure is legal for TD role');
          const heavyTD=normalizeTankDesign({...defaultTankDesign('heavy','anti_tank'),turret:'tank_heavy_fixed_superstructure_turret',gun:'tank_super_heavy_cannon'},'heavy','anti_tank');assert.ok(tankDesignOptions(heavyTD).guns.has('tank_super_heavy_cannon'));
          const invalid=normalizeTankDesign({...light,turret:'tank_heavy_three_man_tank_turret',gun:'tank_super_heavy_cannon'},'light','armor');assert.notEqual(invalid.turret,'tank_heavy_three_man_tank_turret');assert.notEqual(invalid.gun,'tank_super_heavy_cannon');console.log('Tank Designer structural certification invariants passed.');
          """)

          Path('tests/tank-family-certification.test.mjs').write_text("""import assert from 'node:assert/strict';
          import BUILTIN from '../src/builtin1192.js';
          import { configureTankDataPack, TANK_FAMILIES, tankRolesForFamily, tankVariantTargets, defaultTankDesign, normalizeTankDesign, tankDesignOptions, buildTankDesign } from '../src/tank.js';
          configureTankDataPack(BUILTIN,1940);assert.deepEqual(TANK_FAMILIES,['light','medium','heavy','modern','super_heavy','amphibious','land_cruiser']);
          for(const f of ['light','medium','heavy'])assert.deepEqual(tankRolesForFamily(f),['armor','anti_tank','artillery','anti_air','flame','amphibious']);assert.deepEqual(tankRolesForFamily('modern'),['armor','anti_tank','artillery','anti_air']);assert.deepEqual(tankRolesForFamily('super_heavy'),['armor','anti_tank','artillery','anti_air']);
          const aa=buildTankDesign(defaultTankDesign('medium','anti_air'));assert.equal(aa.role,'anti_air');assert.match(aa.roleEquipmentId,/medium_tank_aa_chassis_/);assert.equal(aa.hardness,.65,'duplicate archetype SPAA hardness must replace base chassis hardness');assert.ok(aa.airAttack>0);
          const art=buildTankDesign(defaultTankDesign('light','artillery'));assert.equal(art.hardness,.5);assert.match(art.roleEquipmentId,/light_tank_artillery_chassis_/);
          const amph=defaultTankDesign('medium','amphibious');assert.ok(amph.specials.includes('amphibious_drive'));assert.equal(buildTankDesign(amph).hardness,.7);assert.equal(tankVariantTargets('medium','amphibious').equipmentKey,'medium_tank_amphibious_chassis');
          const flame=defaultTankDesign('heavy','flame');assert.ok(['flamethrower','advanced_flamethrower'].includes(flame.gun));assert.match(buildTankDesign(flame).roleEquipmentId,/heavy_tank_flame_chassis_/);
          assert.equal(tankVariantTargets('modern','anti_tank').units[0].id,'modern_tank_destroyer_brigade');assert.equal(tankVariantTargets('super_heavy','armor').units[0].kind,'support');assert.equal(tankVariantTargets('amphibious','armor').units[0].id,'amphibious_armor');assert.equal(tankVariantTargets('land_cruiser','armor').units[0].kind,'support');
          const lc=defaultTankDesign('land_cruiser','armor'),lcOpts=tankDesignOptions(lc);assert.equal(Object.keys(lc.slotModules).length,9);assert.equal(Object.keys(lcOpts.genericSlots).length,9);assert.ok(lc.slotModules.lc_main_armament_slot!=='none');assert.equal(BUILTIN.equipment.land_cruiser_chassis_1.moduleCountLimits.length,12);assert.equal(BUILTIN.meta.landCruiserCountLimitsCertified,true);
          const slots={...lc.slotModules,lc_special_features_slot_1:'lc_radio_1',lc_special_features_slot_2:'lc_radio_2'};const limited=normalizeTankDesign({...lc,slotModules:slots},'land_cruiser','armor');assert.equal([limited.slotModules.lc_special_features_slot_1,limited.slotModules.lc_special_features_slot_2].filter(x=>/^lc_radio_/.test(x)).length,1,'source category count limit allows only one radio');
          const builtLc=buildTankDesign(limited);assert.ok(builtLc.buildCost>=330);assert.equal(builtLc.class,'land_cruiser');assert.equal(builtLc.role,'armor');console.log('Extended Tank Designer family/role invariants passed.');
          """)
          p=Path('package.json');s=p.read_text();needle='node tests/tank-designer-certification.test.mjs && node tests/tank-module-source-certification.test.mjs';
          if 'tank-family-certification.test.mjs' not in s:
            if needle not in s:raise SystemExit('package tank test insertion point missing')
            s=s.replace(needle,'node tests/tank-designer-certification.test.mjs && node tests/tank-family-certification.test.mjs && node tests/tank-module-source-certification.test.mjs',1)
          p.write_text(s)
          PY
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/designerData.js src/builtin1192.js src/builtin1192/land-cruiser-count-limits-1192.js src/tank.js src/main.js tests/land-data-certification.test.mjs tests/tank-designer-certification.test.mjs tests/tank-family-certification.test.mjs package.json
          git commit -m 'fix: certify full 1.19.2 Tank Designer families'
          git push
