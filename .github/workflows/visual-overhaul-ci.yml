name: Visual Overhaul CI
on:
  push:
    branches: [ui-visual-overhaul-1.19.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
