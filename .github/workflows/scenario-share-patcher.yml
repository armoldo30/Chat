name: Scenario Share Patcher

on:
  push:
    branches: [shareable-scenarios]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run scenario share integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shareable-scenarios
          fetch-depth: 0
      - name: Apply shareable scenario integration
        run: python3 scripts/apply-scenario-share-integration.py
      - name: Remove patch helpers and commit integration
        run: |
          git rm .github/workflows/scenario-share-patcher.yml scripts/apply-scenario-share-integration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "feat: wire shareable scenarios into planner"
          git push origin HEAD:shareable-scenarios
