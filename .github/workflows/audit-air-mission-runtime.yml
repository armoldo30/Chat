name: Persist Air Mission Runtime Audit
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add mission-specific source stat runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('src/air.js');s=p.read_text()
          anchor="export function buildAirDesign(raw){return PACK_MODE?buildImportedAirDesign(raw):buildFallbackAirDesign(raw);}\n"
          mission="""export function buildAirDesign(raw){return PACK_MODE?buildImportedAirDesign(raw):buildFallbackAirDesign(raw);}

          const AIR_MISSION_IDS={
            air_superiority:['air_superiority'],cas:['close_air_support'],naval_strike:['naval_bomber'],interception:['interception'],
            strategic_bombing:['strategic_bomber'],port_strike:['port_strike'],logistics_strike:['attack_logistics'],naval_patrol:['naval_patrol'],
            minelaying:['naval_mines_planting'],kamikaze:['naval_kamikaze']
          };
          const AIR_MISSION_STAT_MAP={
            air_attack:'airAttack',air_defence:'airDefense',air_agility:'agility',maximum_speed:'maxSpeed',air_range:'range',air_ground_attack:'groundAttack',
            naval_strike_attack:'navalAttack',naval_strike_targetting:'navalTargeting',air_bombing:'strategicBombing',weight:'weight',fuel_consumption:'fuelConsumption',
            night_penalty:'nightPenalty',surface_detection:'surfaceDetection',sub_detection:'subDetection'
          };
          function missionBlocks(record){const m=moduleSource(record);if(Array.isArray(m?.missionTypeStats))return m.missionTypeStats;return m?.raw?.mission_type_stats?[m.raw.mission_type_stats]:[];}
          function missionLimitMatches(limit,wanted){
            if(typeof limit==='string')return wanted.has(limit);
            if(Array.isArray(limit))return limit.some(x=>missionLimitMatches(x,wanted));
            if(limit&&typeof limit==='object')return Object.entries(limit).some(([k,v])=>/mission|type|limit/i.test(k)&&missionLimitMatches(v,wanted));
            return false;
          }
          function applyMissionStatMap(state,raw,mode='add'){
            for(const [key,value] of Object.entries(raw||{})){
              const dst=AIR_MISSION_STAT_MAP[key],n=Number(value);if(!dst||!Number.isFinite(n))continue;
              if(mode==='multiply')state[dst]=(Number(state[dst])||0)*(1+n);else state[dst]=(Number(state[dst])||0)+n;
            }
          }
          export function airMissionProfileBuilt(design,mission='air_superiority'){
            const state={...design},wanted=new Set(AIR_MISSION_IDS[mission]||[mission]),applied=[];let averageInference=false;
            if(design?.source==='game-pack')for(const rec of selectedPackModules(design))for(const block of missionBlocks(rec)){
              if(!missionLimitMatches(block?.limit,wanted))continue;
              applyMissionStatMap(state,block?.add_stats,'add');applyMissionStatMap(state,block?.multiply_stats,'multiply');applyMissionStatMap(state,block?.add_average_stats,'add');
              if(block?.add_average_stats&&Object.keys(block.add_average_stats).length)averageInference=true;applied.push({module:rec.id,limit:block.limit});
            }
            state.weight=Math.max(0,Number(state.weight)||0);state.requiredThrust=state.weight;state.thrustRatio=state.requiredThrust>0?(Number(state.thrust)||0)/state.requiredThrust:1;state.overweight=Number(state.thrust)>0&&state.weight>Number(state.thrust);
            state.mission=mission;state.appliedMissionBlocks=applied.length;state.appliedMissionSources=applied;state.missionAverageStatInference=averageInference;
            state.missionStatCompleteness=design?.source==='game-pack'?'partial-bundle':'analytical-fallback';
            return state;
          }
          export function airMissionProfile(raw,mission='air_superiority'){return airMissionProfileBuilt(buildAirDesign(raw),mission);}
          """
          if 'export function airMissionProfileBuilt' not in s:
            if anchor not in s:raise SystemExit('air build anchor missing')
            s=s.replace(anchor,mission,1)
          old="""export function airMissionEfficiencyBuilt(d,mission='air_superiority'){
            if(mission==='cas')return {score:d.groundAttack/Math.max(.001,d.buildCost)*100,primary:d.groundAttack,label:'Ground attack / IC'};
            if(mission==='naval_strike')return {score:d.navalAttack/Math.max(.001,d.buildCost)*100,primary:d.navalAttack,label:'Naval attack / IC'};
            return {score:(d.airAttack*Math.sqrt(Math.max(0,d.agility))*Math.sqrt(Math.max(.01,d.maxSpeed/300)))/Math.max(.001,d.buildCost),primary:d.airAttack,label:'Air combat value / IC'};
          }"""
          new="""export function airMissionEfficiencyBuilt(d,mission='air_superiority'){
            const p=airMissionProfileBuilt(d,mission),meta={profile:p,appliedBlocks:p.appliedMissionBlocks,completeness:p.missionStatCompleteness};
            if(mission==='cas')return {...meta,score:p.groundAttack/Math.max(.001,p.buildCost)*100,primary:p.groundAttack,label:'Ground attack / IC'};
            if(mission==='naval_strike')return {...meta,score:p.navalAttack/Math.max(.001,p.buildCost)*100,primary:p.navalAttack,label:'Naval attack / IC'};
            return {...meta,score:(p.airAttack*Math.sqrt(Math.max(0,p.agility))*Math.sqrt(Math.max(.01,p.maxSpeed/300)))/Math.max(.001,p.buildCost),primary:p.airAttack,label:'Air combat value / IC'};
          }"""
          if old not in s:raise SystemExit('air efficiency body missing')
          s=s.replace(old,new,1);p.write_text(s)

          # Make the selected-mission metric disclose whether surviving source blocks were applied.
          p=Path('src/main.js');s=p.read_text()
          old='<small>enemy ${fmt(effB.score,2)}</small>'
          new='<small>enemy ${fmt(effB.score,2)} · mission blocks A/B ${effA.appliedBlocks}/${effB.appliedBlocks} · ${effA.completeness}</small>'
          if old not in s:raise SystemExit('air efficiency UI marker missing')
          p.write_text(s.replace(old,new,1))

          Path('tests/air-mission-runtime-certification.test.mjs').write_text("""import assert from 'node:assert/strict';
          import BUILTIN from '../src/builtin1192.js';
          import { configureAirDataPack, AIRFRAMES, defaultAirDesign, normalizeAirDesign, airDesignOptions, buildAirDesign, airMissionProfileBuilt, airMissionEfficiencyBuilt } from '../src/air.js';
          const close=(a,b,msg)=>assert.ok(Math.abs(a-b)<1e-9,`${msg}: ${a} != ${b}`);
          configureAirDataPack(BUILTIN,1940);
          const frameId=Object.keys(AIRFRAMES).find(id=>!AIRFRAMES[id].carrier&&AIRFRAMES[id].size==='small'&&Object.keys(AIRFRAMES[id]._equipment.moduleSlots||{}).some(slot=>airDesignOptions({airframe:id,size:'small'}).slots[slot]?.has('bomb_locks')));assert.ok(frameId,'source graph must expose a small airframe slot for bomb_locks');
          let raw=normalizeAirDesign({...defaultAirDesign('small'),airframe:frameId},'small'),opts=airDesignOptions(raw),bombSlot=Object.keys(opts.slots).find(slot=>opts.slots[slot].has('bomb_locks'));assert.ok(bombSlot);raw=normalizeAirDesign({...raw,slotModules:{...raw.slotModules,[bombSlot]:'bomb_locks'}},'small');const base=buildAirDesign(raw),nav=airMissionProfileBuilt(base,'naval_strike');assert.equal(nav.appliedMissionBlocks,1);close(nav.navalAttack,base.navalAttack+2,'bomb locks naval attack');close(nav.agility,base.agility-15,'bomb locks naval agility');close(nav.weight,base.weight+4,'bomb locks naval weight');close(nav.navalTargeting,4,'bomb locks naval targeting');assert.equal(nav.missionStatCompleteness,'partial-bundle');
          const cas=airMissionProfileBuilt(base,'cas');assert.equal(cas.appliedMissionBlocks,0,'naval_bomber block must never leak into CAS');close(cas.navalAttack,base.navalAttack,'naval attack does not leak across missions');
          const eff=airMissionEfficiencyBuilt(base,'naval_strike');assert.equal(eff.primary,nav.navalAttack);assert.equal(eff.appliedBlocks,1);assert.equal(eff.completeness,'partial-bundle');
          const rocketFrame='small_plane_airframe_5',rocketBase=normalizeAirDesign({...defaultAirDesign('small'),airframe:rocketFrame},'small'),rocketOpts=airDesignOptions(rocketBase),engineSlot=Object.keys(rocketOpts.slots).find(slot=>rocketOpts.slots[slot].has('rocket_engine_1'));assert.ok(engineSlot);const rocket=buildAirDesign(normalizeAirDesign({...rocketBase,slotModules:{...rocketBase.slotModules,[engineSlot]:'rocket_engine_1'}},'small')),intercept=airMissionProfileBuilt(rocket,'interception');assert.equal(intercept.appliedMissionBlocks,1);close(intercept.agility,rocket.agility*1.1,'rocket interception agility');assert.equal(airMissionProfileBuilt(rocket,'air_superiority').appliedMissionBlocks,0,'interception multiplier must not leak into air superiority');
          console.log('Air mission-specific runtime invariants passed.');
          """)

          p=Path('package.json');data=json.loads(p.read_text());cmd=data['scripts']['test']
          if 'air-mission-runtime-certification.test.mjs' not in cmd:cmd=cmd.replace('node tests/air-designer-certification.test.mjs','node tests/air-designer-certification.test.mjs && node tests/air-mission-runtime-certification.test.mjs',1)
          data['scripts']['test']=cmd;p.write_text(json.dumps(data,indent=2)+"\n")

          p=Path('DATA_AUDIT_1.19.2.md');s=p.read_text()
          s=s.replace('### A-003 — repeated `mission_type_stats` importer loss — PARSER FIXED / BUILT-IN DATA REIMPORT PENDING','### A-003 — repeated `mission_type_stats` importer loss — PARSER + RUNTIME FIXED / BUILT-IN DATA REIMPORT PENDING')
          needle='The current bundled modules are explicitly marked `airMissionStatBlocksCertified: false` until the authoritative 1.19.2 plane-module source is re-imported.'
          repl=needle+' The Air runtime now also applies every surviving mission block only to its exact mission profile (for example `naval_bomber`, `interception`, or `port_strike`) and carries mission-specific attack, agility, weight, targeting, bombing, detection, and night modifiers into mission scoring. Missing blocks remain missing rather than being inferred as zero-value source facts.'
          if needle in s:s=s.replace(needle,repl,1)
          s=s.replace('Source-backed and testable now: concrete airframe selection, slot topology, allowed module categories, base airframe/module stats, IC/resources, weight/thrust, carrier-frame identity, and equipment-role metadata (`add_equipment_type`). Still not certified: repeated mission-specific module effects, the missing 13 aircraft duplicate archetypes, and exact `hoi4.exe`/`NAir` combat resolution.','Source-backed and testable now: concrete airframe selection, slot topology, allowed module categories, base airframe/module stats, IC/resources, carrier-frame identity, equipment-role metadata (`add_equipment_type`), and mission-profile application semantics for every mission block actually present in the bundle. Weight/thrust and CAS/naval/strategic mission statistics remain only partially complete because many source mission blocks are absent from the current bundle. Still not certified: completeness of repeated mission-specific module effects, the missing 13 aircraft duplicate archetypes, and exact `hoi4.exe`/`NAir` combat resolution.')
          p.write_text(s)
          PY
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated mission runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json DATA_AUDIT_1.19.2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: apply source Air mission stat profiles"
          git push