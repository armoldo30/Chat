name: MIO staged payload validation
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recoverable staged payload prefix
        run: |
          cat .mio-stage/part-* > /tmp/mio-payload.b64
          base64 -d /tmp/mio-payload.b64 > /tmp/mio-payload.xz
          set +e
          xz -dc /tmp/mio-payload.xz > /tmp/mio-patch.py 2>/tmp/xz.err
          rc=$?
          set -e
          echo "XZ_RC=$rc"
          cat /tmp/xz.err
          echo "PAYLOAD_BYTES=$(wc -c < /tmp/mio-patch.py)"
          echo "PAYLOAD_SHA256=$(sha256sum /tmp/mio-patch.py | cut -d' ' -f1)"
          echo '--- HEAD ---'
          head -n 12 /tmp/mio-patch.py
          echo '--- TAIL ---'
          tail -n 60 /tmp/mio-patch.py
