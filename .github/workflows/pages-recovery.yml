name: Pages Recovery Deploy
# Atlas packaging recovery trigger
# Atlas bleed recovery trigger
# Explicit atlas clip recovery trigger
# Launch navigation cleanup recovery trigger
# Stat icon payload repair recovery trigger
# Designer picker icon identity recovery trigger
# Retired odd battalions recovery trigger
# Industry retirement hotfix recovery trigger
# Header copy cleanup recovery trigger
# Homepage intro copy recovery trigger
# Homepage intro trim recovery trigger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-recovery.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-recovery
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
