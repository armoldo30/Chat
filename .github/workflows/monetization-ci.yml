name: Monetization Readiness CI
on:
  push:
    branches: [launch-monetization-1.19.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full certified tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify launch files
        run: |
          test -f dist/privacy.html
          test -f dist/ads.txt
          grep -Fq 'Privacy Policy' dist/privacy.html
          grep -Fq 'Advertising is not enabled yet.' dist/ads.txt
          ! grep -q '^google.com, pub-' dist/ads.txt
          ! grep -q 'google-adsense-account' dist/index.html
      - name: Served-site smoke with ads disabled
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/war-planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS 'http://127.0.0.1:4173/' >/tmp/index.html
          curl -fsS 'http://127.0.0.1:4173/privacy.html' >/tmp/privacy.html
          curl -fsS 'http://127.0.0.1:4173/ads.txt' >/tmp/ads.txt
          grep -Fq 'HOI4 War Planner' /tmp/index.html
          grep -Fq 'Privacy' /tmp/index.html
          grep -Fq 'Privacy Policy' /tmp/privacy.html
          grep -Fq 'Advertising is not enabled yet.' /tmp/ads.txt
          ! grep -Fq 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/index.html
