name: Persist Full Tank Designer Audit v2
on:
  push:
    branches: [audit-1.19.2]
    paths: ['.github/workflows/audit-tank-family-implementation-v2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Reapply reviewed family implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/audit-tank-family-implementation.yml').read_text()
          body=text.split("          python - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          lines=[line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          exec('\n'.join(lines),{'__name__':'__main__'})
          p=Path('tests/land-data-certification.test.mjs');s=p.read_text()
          old="assert.ok(Object.keys(cat.chassis).every(id=>/_tank_chassis_[0-3]$/.test(id)));"
          new="assert.ok(Object.entries(cat.chassis).filter(([,x])=>['light','medium','heavy'].includes(x.class)).every(([id])=>/_tank_chassis_[0-3]$/.test(id)),'standard light/medium/heavy chassis IDs remain the four 0-3 source generations');for(const id of ['modern_tank_chassis_1','super_heavy_tank_chassis_1','amphibious_tank_chassis_1','land_cruiser_chassis_1'])assert.ok(cat.chassis[id],`${id} must be exposed by the Tank Designer catalog`);"
          if old not in s:raise SystemExit('stale standard-chassis assertion missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/designerData.js src/builtin1192.js src/builtin1192/land-cruiser-count-limits-1192.js src/tank.js src/main.js tests/land-data-certification.test.mjs tests/tank-designer-certification.test.mjs tests/tank-family-certification.test.mjs package.json
          git commit -m 'fix: certify full 1.19.2 Tank Designer families'
          git push
