name: Production Formulas Audit Patcher

on:
  push:
    branches: [audit-1.19.2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded Production formulas patch
        run: python .audit/production_formula_patch.py
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit audited Production formulas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.js src/engine.js src/main.js src/builtin1192/production-formulas-certification-1192.js tests/engine.test.mjs tests/defines-runtime-certification.test.mjs tests/production-formulas-certification.test.mjs package.json PRODUCTION_FORMULAS_AUDIT_1.19.2.md DATA_AUDIT_1.19.2.md DEFINES_AUDIT_1.19.2.md
          git commit -m "audit: certify HOI4 1.19.2 Production formulas"
          git push origin HEAD:audit-1.19.2
