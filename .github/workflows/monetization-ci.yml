name: Monetization Readiness CI
on:
  push:
    branches: [launch-monetization-1.19.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full certified tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify launch files
        run: |
          test -f dist/privacy.html
          test -f dist/ads.txt
          grep -Fq 'Privacy Policy' dist/privacy.html
          grep -Fq 'Advertising is not enabled yet.' dist/ads.txt
          ! grep -q '^google.com, pub-' dist/ads.txt
          ! grep -q 'google-adsense-account' dist/index.html
      - name: Browser smoke with ads disabled
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 --directory dist >/tmp/war-planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          timeout 30s "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2000 --dump-dom 'http://127.0.0.1:4173/#data' >/tmp/index.html
          grep -Fq 'Data Packs' /tmp/index.html
          grep -Fq 'Privacy' /tmp/index.html
          ! grep -Fq 'id="hoi4-adsense-script"' /tmp/index.html
          curl -fsS 'http://127.0.0.1:4173/privacy.html' | grep -Fq 'Privacy Policy'
