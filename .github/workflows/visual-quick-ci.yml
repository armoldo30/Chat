name: Visual Quick Controls CI
on:
  push:
    branches: [ui-visual-overhaul-1.19.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test picture-first controls
        run: node tests/quick-controls.test.mjs
