name: Persist Air Designer Audit
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reviewed Air Designer structural implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Source-derived Air Designer catalog: concrete frames + exact modules referenced by their slots.
          p=Path('src/designerData.js');s=p.read_text()
          old="function airframeRecord(id,e,size,pack){const s=equipmentToState(e);return {id,name:humanize(id),size,year:e.year,source:'game-pack',gameId:id,requirements:mergedRequirements(pack,'equipment',id,e.raw),_equipment:e,...s};}"
          new="function airframeRecord(id,e,size,pack){const s=equipmentToState(e);return {id,name:humanize(id),size,carrier:/^cv_/.test(id),year:e.year,source:'game-pack',gameId:id,requirements:mergedRequirements(pack,'equipment',id,e.raw),_equipment:e,...s};}"
          if old not in s: raise SystemExit('airframeRecord marker missing')
          s=s.replace(old,new,1)
          a=s.index('export function airCatalogFromPack(pack){');b=s.index('export function chooseCatalogDefault',a)
          catalog="""export function airCatalogFromPack(pack){
            const none={id:'none',name:'Empty',source:'system',_module:null};
            const out={airframes:{},slotModules:{none},engines:{},weapons:{none},defense:{none:{...none,name:'No Defense Module'}},specials:{none}};
            const slotCategories=new Set();
            for(const id of Object.keys(pack?.equipment||{})){
              const e=resolvedEquipment(pack,id),size=airSize(id,e);
              if(!size||!hasSlots(e)||!/^(?:cv_)?(?:small|medium|large)_plane_airframe_\\d+$/.test(id))continue;
              out.airframes[id]=airframeRecord(id,e,size,pack);
              for(const slot of Object.values(e.moduleSlots||{}))for(const category of (Array.isArray(slot.allowed_module_categories)?slot.allowed_module_categories:[slot.allowed_module_categories]))if(category)slotCategories.add(String(category));
            }
            const weaponCategories=new Set(['fighter_weapon','cas_weapon','nav_bomber_weapon','strat_weapon','tac_weapon','kamikaze_bomber_weapon','recon_camera','mine_warfare_offense']);
            for(const m of Object.values(pack?.modules||{})){
              if(!slotCategories.has(String(m?.category||'')))continue;
              const rec=moduleRecord(m,pack),category=String(m.category||'');out.slotModules[m.id]=rec;
              if(/engine_type$/.test(category))out.engines[m.id]=rec;
              else if(weaponCategories.has(category))out.weapons[m.id]=rec;
              else {out.specials[m.id]=rec;if(/defense_turret|mine_warfare_defense/.test(category)||/armor_plate|self_sealing/.test(m.id))out.defense[m.id]=rec;}
            }
            out.meta={airframes:Object.keys(out.airframes).length,carrierAirframes:Object.values(out.airframes).filter(x=>x.carrier).length,slotCategories:slotCategories.size,slotModules:Object.keys(out.slotModules).length-1,engines:Object.keys(out.engines).length,weapons:Object.keys(out.weapons).length-1,defense:Object.keys(out.defense).length-1,specials:Object.keys(out.specials).length-1};
            return out;
          }

          """
          p.write_text(s[:a]+catalog+s[b:])

          # Slot-driven runtime, preserving the analytical air-combat model below it.
          p=Path('src/air.js');s=p.read_text();a=s.index('let PACK_MODE=');b=s.index('function combatModifier',a)
          s=s[:a]+Path('audit/air-runtime-tail.js').read_text()+'\n\n'+s[b:];p.write_text(s)

          # Air Lab UI: render the actual source slots in pack mode.
          p=Path('src/main.js');s=p.read_text()
          old="import { AIRFRAMES, AIR_ENGINES, AIR_WEAPONS, AIR_DEFENSE_MODULES, AIR_SPECIALS, defaultAirDesign, normalizeAirDesign, buildAirDesign, compareAirDesigns, compareBuiltAirDesigns, airMissionEfficiency, airMissionEfficiencyBuilt, configureAirDataPack, airDataStatus } from './air.js';"
          new="import { AIRFRAMES, AIR_ENGINES, AIR_WEAPONS, AIR_DEFENSE_MODULES, AIR_SPECIALS, AIR_SLOT_MODULES, defaultAirDesign, normalizeAirDesign, buildAirDesign, compareAirDesigns, compareBuiltAirDesigns, airMissionEfficiency, airMissionEfficiencyBuilt, configureAirDataPack, airDataStatus, airDesignOptions, airSlotLabel } from './air.js';"
          if old not in s: raise SystemExit('main air import marker missing')
          s=s.replace(old,new,1)
          a=s.index('function airDesignStats(d){');b=s.index('function air(c){',a)
          s=s[:a]+Path('audit/main-air-functions.js').read_text()+'\n'+s[b:]
          s=s.replace('Exact executable parity awaits imported NAir defines and current aircraft modules.','Air-to-air exchange remains analytical. Source-slot aircraft data is active; exact NAir executable parity and repeated mission-specific module effects remain separately audited.',1)
          p.write_text(s)

          # Parser: preserve repeated mission_type_stats blocks for future source re-imports.
          p=Path('src/parser.js');s=p.read_text()
          anchor="function plainScalarMap(v){\n  const out={};\n  for(const [key,value] of Object.entries(obj(last(v))))if(key!=='__items')out[key]=String(last(value));\n  return out;\n}\n"
          helper=anchor+"function plainMissionTypeStats(v){return (Array.isArray(v)?v:[v]).map(x=>obj(x)).filter(x=>Object.keys(x).length).map(x=>plainMap(x));}\n"
          if 'function plainMissionTypeStats' not in s:
            if anchor not in s: raise SystemExit('parser helper marker missing')
            s=s.replace(anchor,helper,1)
          old="forbidEquipmentTypeExactMatch:items(raw.forbid_equipment_type_exact_match),forbidEquipmentTypeExactMatchForCategory:plainScalarMap(raw.forbid_equipment_type_exact_match_for_category),xpCost:num(last(raw.xp_cost)),raw:plainMap(raw)};"
          new="forbidEquipmentTypeExactMatch:items(raw.forbid_equipment_type_exact_match),forbidEquipmentTypeExactMatchForCategory:plainScalarMap(raw.forbid_equipment_type_exact_match_for_category),missionTypeStats:plainMissionTypeStats(raw.mission_type_stats),xpCost:num(last(raw.xp_cost)),raw:plainMap(raw)};"
          if old not in s: raise SystemExit('module parser marker missing')
          s=s.replace(old,new,1);p.write_text(s)

          # Mark the two known Air source-completeness gaps in the bundled pack rather than hiding them.
          p=Path('src/builtin1192.js');s=p.read_text()
          anchor="BUILTIN_1192.requirements=BUILTIN_1192.requirements||{};"
          inject="for(const module of Object.values(BUILTIN_1192.modules||{}))if(!Array.isArray(module.missionTypeStats)&&module.raw?.mission_type_stats)module.missionTypeStats=[module.raw.mission_type_stats];\n"+anchor
          if 'module.missionTypeStats=[module.raw.mission_type_stats]' not in s:
            if anchor not in s: raise SystemExit('builtin mission marker missing')
            s=s.replace(anchor,inject,1)
          s=s.replace('landCruiserCountLimitsCertified:true};','landCruiserCountLimitsCertified:true,airMissionStatBlocksCertified:false,airDuplicateArchetypesCertified:false};',1)
          p.write_text(s)

          # Update the generic designer fixture to use source-style aircraft slot categories.
          p=Path('tests/designer-data.test.mjs');s=p.read_text()
          s=s.replace("moduleSlots:{fixed_engine:{allowed_module_categories:['plane_engine_type']}},raw:{}", "moduleSlots:{fixed_main_weapon_slot:{required:true,allowed_module_categories:['fighter_weapon']},engine_type_slot:{required:true,allowed_module_categories:['plane_engine_type']},special_type_slot_1:{required:false,allowed_module_categories:['plane_special_module_small','plane_special_module_defense_turret']}},raw:{}",1)
          s=s.replace("category:'plane_weapon'", "category:'fighter_weapon'",1).replace("category:'plane_special_module_defense'", "category:'plane_special_module_small'",1).replace("category:'plane_special_module'", "category:'plane_special_module_small'",1)
          s=s.replace("assert.ok(air.specials.drop_tanks);", "assert.ok(air.specials.drop_tanks);assert.equal(air.meta.slotCategories,4);assert.equal(air.meta.slotModules,4);")
          p.write_text(s)

          Path('tests/air-parser-certification.test.mjs').write_text("""import assert from 'node:assert/strict';
          import { parseClausewitz, extractEquipmentModules } from '../src/parser.js';
          const parsed=parseClausewitz(`equipment_modules={ bomb={ category=cas_weapon mission_type_stats={ limit=close_air_support add_stats={ air_ground_attack=6 } } mission_type_stats={ limit=naval_bomber add_stats={ naval_strike_attack=2 } } } }`);
          const m=extractEquipmentModules(parsed).bomb;assert.equal(m.missionTypeStats.length,2);assert.equal(m.missionTypeStats[0].limit,'close_air_support');assert.equal(m.missionTypeStats[0].add_stats.air_ground_attack,6);assert.equal(m.missionTypeStats[1].limit,'naval_bomber');assert.equal(m.missionTypeStats[1].add_stats.naval_strike_attack,2);console.log('Air repeated mission-stat parser invariants passed.');
          """)

          Path('tests/air-designer-certification.test.mjs').write_text("""import assert from 'node:assert/strict';
          import BUILTIN from '../src/builtin1192.js';
          import { airCatalogFromPack } from '../src/designerData.js';
          import { configureAirDataPack, AIRFRAMES, AIR_SLOT_MODULES, defaultAirDesign, normalizeAirDesign, airDesignOptions, buildAirDesign } from '../src/air.js';
          const cat=airCatalogFromPack(BUILTIN);assert.equal(cat.meta.airframes,21,'only concrete 1.19.2 airframes are selectable');assert.equal(cat.meta.carrierAirframes,5);assert.equal(cat.meta.slotCategories,29);assert.equal(cat.meta.slotModules,94);assert.equal(cat.meta.engines,33);assert.equal(cat.meta.weapons,29);assert.ok(!cat.airframes.small_plane_airframe&&!cat.airframes.cv_small_plane_airframe&&!cat.airframes.medium_plane_airframe&&!cat.airframes.large_plane_airframe,'airframe archetype templates are not selectable');
          for(const id of Object.keys(cat.slotModules))if(id!=='none')assert.ok(!/^tank_|^lc_/.test(id),`${id} leaked into Air Designer`);
          configureAirDataPack(BUILTIN,1940);assert.equal(Object.keys(AIRFRAMES).length,21);assert.equal(Object.keys(AIR_SLOT_MODULES).length-1,94);
          const d=defaultAirDesign('small'),frame=AIRFRAMES[d.airframe],opts=airDesignOptions(d);assert.ok(d.airframe.startsWith('small_plane_airframe_'));assert.equal(frame.carrier,false);for(const [slotId,slot] of Object.entries(frame._equipment.moduleSlots)){assert.ok(opts.slots[slotId]);if(slot.required)assert.notEqual(d.slotModules[slotId],'none',`${slotId} is required`);assert.ok(opts.slots[slotId].has(d.slotModules[slotId]),`${d.slotModules[slotId]} must be source-compatible with ${slotId}`);}
          const jet=normalizeAirDesign({...d,airframe:'small_plane_airframe_5'},'small'),jetOpts=airDesignOptions(jet);assert.ok(jetOpts.slots.engine_type_slot.has('jet_engine_1x'));assert.ok(jetOpts.slots.engine_type_slot.has('rocket_engine_1'));assert.ok(!jetOpts.slots.engine_type_slot.has('engine_4_1x'),'1950 small airframe source slot excludes piston engines');
          const carrier=normalizeAirDesign({...d,airframe:'cv_small_plane_airframe_3'},'small');assert.equal(AIRFRAMES[carrier.airframe].carrier,true);for(const [slotId,slot] of Object.entries(AIRFRAMES[carrier.airframe]._equipment.moduleSlots))if(slot.required)assert.notEqual(carrier.slotModules[slotId],'none');
          const migrated=normalizeAirDesign({name:'Legacy Fighter',engine:'engine_3',weapons:['heavy_mg','bomb_locks','none'],defense:'self_sealing',specials:['drop_tanks','none']},'small');assert.ok(migrated.slotModules.engine_type_slot&&migrated.slotModules.engine_type_slot!=='none');assert.ok(Object.values(migrated.slotModules).some(x=>x==='heavy_mg_4x'||x==='heavy_mg_2x'));const built=buildAirDesign(migrated);assert.ok(built.buildCost>0&&built.thrust>0);assert.ok(built.roles.includes('fighter'),'role comes from source add_equipment_type metadata');assert.equal(built.source,'game-pack');assert.equal(built.missionStatCompleteness,'partial-bundle');
          const casSlots={...migrated.slotModules};const casSlot=Object.keys(AIRFRAMES[migrated.airframe]._equipment.moduleSlots).find(slot=>airDesignOptions(migrated).slots[slot]?.has('bomb_locks'));if(casSlot){casSlots[casSlot]='bomb_locks';const cas=buildAirDesign(normalizeAirDesign({...migrated,slotModules:casSlots},'small'));assert.ok(cas.roles.includes('cas'),'CAS role is identified from source equipment type metadata even while mission-stat blocks remain incomplete');}
          assert.equal(BUILTIN.meta.airMissionStatBlocksCertified,false);assert.equal(BUILTIN.meta.airDuplicateArchetypesCertified,false);console.log('1.19.2 Air Designer structural/source-slot invariants passed.');
          """)

          # Permanent test wiring.
          p=Path('package.json');data=json.loads(p.read_text());cmd=data['scripts']['test']
          if 'air-parser-certification.test.mjs' not in cmd:cmd=cmd.replace('node tests/air.test.mjs','node tests/air-parser-certification.test.mjs && node tests/air-designer-certification.test.mjs && node tests/air.test.mjs',1)
          data['scripts']['test']=cmd;p.write_text(json.dumps(data,indent=2)+"\n")

          # Record Air audit status precisely: structural pass in progress, known source gaps remain open.
          p=Path('DATA_AUDIT_1.19.2.md');s=p.read_text()
          if '## Phase 3 — Air Designer' not in s:
            s += """

          ## Phase 3 — Air Designer

          Status: **IN PROGRESS — source-slot structure implemented; mission/source-completeness defects remain open**

          Initial source-graph audit identified **21 concrete designable airframes** (5 carrier-small, 6 land-small, 5 medium, 5 large), **29 slot categories**, and **94 equipment modules actually referenced by those frame slots**. The previous heuristic catalog exposed 25 frames and 88 alleged weapons, including archetype templates and unrelated module families.

          The audit branch now derives the Air Designer catalog directly from each concrete airframe's `module_slots`. Required/optional slots and engine multiplicity are structural rules; technology/DLC/Special Project requirements remain informational only. Existing 0.15.0 Air Lab saves migrate into the source-slot model instead of being discarded.

          ### A-001 — heuristic module catalog / fixed slot layout — FIXED

          Pack-mode Air Designer no longer uses a fixed 3-weapon + 1-defense + 2-special layout or text heuristics to decide which modules are aircraft modules. It renders the actual slots on the selected 1.19.2 frame and limits every picker to the source `allowed_module_categories` for that slot. The source corpus currently resolves to exactly **21 airframes / 29 categories / 94 slot modules / 33 engine modules / 29 weapon-role modules**.

          ### A-002 — airframe archetype templates exposed as buildable — FIXED

          The four unnumbered airframe archetypes are excluded. Only numbered concrete frames are selectable. Carrier-small frames remain distinguishable from land small frames.

          ### A-003 — repeated `mission_type_stats` importer loss — PARSER FIXED / BUILT-IN DATA REIMPORT PENDING

          `equipment_modules` may contain repeated `mission_type_stats` blocks. The old module normalizer retained only the final nested block in `raw`, which means the current built-in 1.19.2 bundle cannot be claimed source-complete for CAS/naval/strategic mission-specific attack and targeting effects. The parser now preserves every repeated block for future imports, with a permanent two-block regression test. The current bundled modules are explicitly marked `airMissionStatBlocksCertified: false` until the authoritative 1.19.2 plane-module source is re-imported.

          ### A-004 — aircraft `duplicate_archetypes` missing from built-in runtime — OPEN

          The original source inventory recorded **13 aircraft duplicate-archetype definitions**, but the current bundled runtime contains only the 21 tank definitions restored during the land/tank audit. This is now an explicit completeness defect (`airDuplicateArchetypesCertified: false`), not silently treated as covered. The source-slot designer does not invent replacements; the 13 records must be restored from the authoritative 1.19.2 source before Air data can receive full source-completeness certification.

          ### Current Air certification boundary

          Source-backed and testable now: concrete airframe selection, slot topology, allowed module categories, base airframe/module stats, IC/resources, weight/thrust, carrier-frame identity, and equipment-role metadata (`add_equipment_type`). Still not certified: repeated mission-specific module effects, the missing 13 aircraft duplicate archetypes, and exact `hoi4.exe`/`NAir` combat resolution.
          """
          s=s.replace('| Air equipment/modules | Slot-list defect fixed incidentally; full audit not started | Not fully certified | Not fully certified | Pending |','| Air equipment/modules | **PASS for concrete frame/slot graph; 13 duplicate archetypes open** | **PASS for base stats; repeated mission blocks open** | **PASS for source-slot runtime; mission effects partial** | **In progress** |')
          p.write_text(s)
          PY
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json DATA_AUDIT_1.19.2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: source-slot 1.19.2 Air Designer"
          git push