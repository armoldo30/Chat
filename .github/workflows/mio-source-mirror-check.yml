name: MIO source mirror check
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare candidate mirrors against manifest samples
        shell: python
        run: |
          import json,re,hashlib,urllib.request,urllib.parse
          from pathlib import Path
          text=Path('src/builtin1192/mio-source-manifest-1192.js').read_text()
          manifest=json.loads(re.search(r'MIO_SOURCE_1192=(\{.*\});',text,re.S).group(1))
          samples=['00_generic_organization.txt','AFG_organization.txt','GER_organization.txt','USA_organization.txt','RAJ_GOE_organization .txt','mio.txt']
          roots={
            'kama':'https://raw.githubusercontent.com/Kama-Pushka/Kursach-Fizika/master/common/military_industrial_organization/organizations/',
            'sheep':'https://raw.githubusercontent.com/Sheep-of-Latrobe/sheeps-mod/master/common/military_industrial_organization/organizations/',
            'zov':'https://raw.githubusercontent.com/zov-organization/hohli/master/common/military_industrial_organization/organizations/',
            'nw':'https://raw.githubusercontent.com/NWDevTeam/NW_public_git/master/new_ways_alpha/common/military_industrial_organization/organizations/',
            'road56rp':'https://raw.githubusercontent.com/Road-to-56-RP/roadto56rp/master/common/military_industrial_organization/organizations/',
            'tfb':'https://raw.githubusercontent.com/Packerthrowaway/TFB-Their-Finest-Bruh-Public/master/common/military_industrial_organization/organizations/',
          }
          for label,base in roots.items():
            ok=0; miss=0; bad=0; details=[]
            for name in samples:
              try: data=urllib.request.urlopen(base+urllib.parse.quote(name),timeout=20).read()
              except Exception as e: miss+=1; details.append((name,'missing')); continue
              got=hashlib.sha256(data).hexdigest(); exp=manifest['files'][name]['sha256']
              if got==exp: ok+=1; details.append((name,'MATCH'))
              else: bad+=1; details.append((name,got[:12]))
            print('CANDIDATE',label,json.dumps({'matches':ok,'mismatches':bad,'missing':miss,'details':details}))
