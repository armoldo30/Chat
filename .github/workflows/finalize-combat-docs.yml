name: Finalize Combat audit documentation

on:
  push:
    branches: [audit-1.19.2]
    paths:
      - '.github/workflows/finalize-combat-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize audit docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('COMBAT_FORMULAS_AUDIT_1.19.2.md')
          s=p.read_text()
          s=s.replace('Status: **PASS candidate — bounded source certification; final clean CI required**','Status: **PASS — bounded source/runtime certification**')
          p.write_text(s)

          p=Path('DATA_AUDIT_1.19.2.md')
          s=p.read_text()
          s=s.replace('**PASS — 23/23 planner-consumed source values exact; corpus hashes/census retained**','**PASS — 36/36 planner-consumed source values exact; corpus hashes/census retained**')
          s=s.replace('**PASS for current terrain width/inherent attack consumption; unit terrain/tactic execution assigned to combat formulas**','**PASS for terrain width/inherent attack plus exact retained unit-terrain aggregation; tactic execution remains explicitly bounded**')
          s=s.replace('Status: **PASS candidate — final clean CI required.**','Status: **PASS — bounded source/runtime certification.**')
          p.write_text(s)

          p=Path('DEFINES_AUDIT_1.19.2.md')
          s=p.read_text()
          s=s.replace('The planner consumes **23 game-file-exact Defines values**: 20 from `NMilitary` and 3 from `NProduction`.','The planner now consumes **36 game-file-exact Defines values**: 33 from `NMilitary` and 3 from `NProduction`. The original Defines phase certified 23 values; the downstream Combat audit added 13 exact `NMilitary` values from the same retained 1.19.2 source corpus.')
          s=s.replace('**Game-file exact:** the retained three-file corpus fingerprints/census and the 23 planner-consumed source values.','**Game-file exact:** the retained three-file corpus fingerprints/census and the 36 planner-consumed source values now bound by the completed Defines, Production, and Combat audits.')
          s=s.replace('**Planner analytical:** `maxLineResourcePenalty = 0.90`, because no corresponding 1.19.2 source define exists. Other formula-only behaviors such as partial-piercing damage thresholds, supply interpolation, planning/CAS details, and the simulation safety horizon remain deferred.','**Planner analytical:** no active Defines-stage analytical constant remains. The historical `maxLineResourcePenalty = 0.90` placeholder is superseded by the Production audit. Partial piercing, supply interpolation, planning/CAS behavior, and the simulation safety horizon were resolved or explicitly bounded by the Combat audit; exact `hoi4.exe` modifier ordering remains outside game-file-exact claims.')
          s=s.replace('Defines may be closed only when the final `audit-1.19.2` head passes the repository\'s full `npm test` and static build, with Pages configuration/artifact upload and deploy skipped on the audit branch. The next audit phase is **Production formulas**, followed by **Combat formulas**.','Defines is closed at the retained-source boundary. Downstream Production and Combat audits are complete and preserve the same classification rule: source values are exact only where the retained 1.19.2 files prove them, while executable-only behavior is separately bounded.')
          p.write_text(s)
          PY
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit final audit docs and self-remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMBAT_FORMULAS_AUDIT_1.19.2.md DATA_AUDIT_1.19.2.md DEFINES_AUDIT_1.19.2.md
          git rm .github/workflows/finalize-combat-docs.yml
          git diff --cached --check
          git commit -m "audit: close HOI4 1.19.2 Combat formulas certification"
          git push origin HEAD:audit-1.19.2
