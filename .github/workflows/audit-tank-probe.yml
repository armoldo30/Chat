name: Tank Designer Probe
on:
  push:
    branches: [audit-1.19.2]
    paths:
      - 'tests/tank-designer-probe.mjs'
      - '.github/workflows/audit-tank-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe tank designer source graph
        run: node tests/tank-designer-probe.mjs
