name: Air Designer Source Probe
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe exact air slot graph
        run: |
          node --input-type=module <<'JS'
          import B from './src/builtin1192.js';
          import { resolveEquipment } from './src/parser.js';
          const R=resolveEquipment(B.equipment);
          const frames=Object.entries(R).filter(([id,e])=>/(?:^|_)(small|medium|large)_plane_airframe(?:_|$)/.test(id)&&e?.moduleSlots&&Object.keys(e.moduleSlots).length&&e?.raw?.is_archetype!==true);
          const cats=new Set();for(const [,e] of frames)for(const slot of Object.values(e.moduleSlots||{}))for(const c of Array.isArray(slot.allowed_module_categories)?slot.allowed_module_categories:[slot.allowed_module_categories])if(c)cats.add(c);
          const mods=Object.values(B.modules).filter(m=>cats.has(m.category));
          console.log('CONCRETE_FRAMES',frames.length,JSON.stringify(frames.map(([id])=>id).sort()));
          console.log('SLOT_CATEGORIES',cats.size,JSON.stringify([...cats].sort()));
          const groups={};for(const m of mods)(groups[m.category]??=[]).push(m.id);
          for(const [c,ids] of Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)))console.log('AIR_CATEGORY',c,ids.length,JSON.stringify(ids.sort()));
          console.log('SLOT_MODULE_TOTAL',mods.length);
          const dup=Object.values(B.duplicateArchetypes||{}).filter(x=>/plane_airframe/.test(String(x.archetype||'')));
          console.log('AIR_DUPLICATES',dup.length,JSON.stringify(dup));
          const mission=mods.filter(m=>m.raw?.mission_type_stats).map(m=>({id:m.id,mission:m.raw.mission_type_stats,add:m.addStats,mult:m.multiplyStats,avg:m.addAverageStats}));
          console.log('MISSION_STAT_MODULES',mission.length,JSON.stringify(mission));
          JS