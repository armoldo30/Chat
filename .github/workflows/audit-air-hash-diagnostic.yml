name: Air Module Hash Diagnostic
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Split Air structural fingerprints
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import B from './src/builtin1192.js';
          import {resolveEquipment} from './src/parser.js';
          const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;
          const digest=v=>crypto.createHash('sha256').update(JSON.stringify(stable(v))).digest('hex');
          const R=resolveEquipment(B.equipment||{}),frames=Object.values(B.equipment||{}).filter(e=>/^(?:cv_)?(?:small|medium|large)_plane_airframe_\d+$/.test(e?.id||'')),cats=new Set();
          for(const e0 of frames){const e=R[e0.id]||e0;for(const slot of Object.values(e.moduleSlots||{}))for(const c of slot.allowed_module_categories||[])cats.add(c);}
          const ids=Object.keys(B.modules||{}).filter(id=>cats.has(B.modules[id]?.category)).sort(),groups={basic:{},allow:{},forbid:{},addType:{},allowedCats:{},forbidExact:{},forbidExactCat:{}};
          for(const id of ids){const m=B.modules[id];groups.basic[id]={id};for(const k of ['category','guiCategory','parent','xpCost'])if(m?.[k]!==undefined)groups.basic[id][k]=m[k];groups.allow[id]=[...(m?.allowEquipmentType||[])];groups.forbid[id]=[...(m?.forbidEquipmentType||[])];groups.addType[id]=[...(m?.addEquipmentType||[])];groups.allowedCats[id]={...(m?.allowedModuleCategories||{})};groups.forbidExact[id]=[...(m?.forbidEquipmentTypeExactMatch||[])];groups.forbidExactCat[id]={...(m?.forbidEquipmentTypeExactMatchForCategory||{})};}
          console.log('AIR_MODULE_COUNT',ids.length);for(const [k,v] of Object.entries(groups))console.log(k,digest(v));
          JS
