name: Persist Air Designer Audit v2
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reapply reviewed Air implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/audit-air-implementation.yml').read_text()
          body=text.split("          python - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          lines=[line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          exec('\n'.join(lines),{'__name__':'__main__'})
          p=Path('tests/air-designer-certification.test.mjs');s=p.read_text()
          old="for(const id of Object.keys(cat.slotModules))if(id!=='none')assert.ok(!/^tank_|^lc_/.test(id),`${id} leaked into Air Designer`);"
          new="assert.ok(!cat.slotModules.tank_medium_cannon,'tank armament must not leak into Air Designer');assert.ok(!cat.slotModules.lc_medium_cannon_turret,'Land Cruiser armament must not leak into Air Designer');const sourceCats=new Set(Object.values(cat.airframes).flatMap(f=>Object.values(f._equipment.moduleSlots||{}).flatMap(slot=>Array.isArray(slot.allowed_module_categories)?slot.allowed_module_categories:[slot.allowed_module_categories])));for(const [id,rec] of Object.entries(cat.slotModules))if(id!=='none')assert.ok(sourceCats.has(rec.category),`${id} is not referenced by any concrete aircraft slot category`);"
          if old not in s:raise SystemExit('leakage assertion marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json DATA_AUDIT_1.19.2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: source-slot 1.19.2 Air Designer"
          git push