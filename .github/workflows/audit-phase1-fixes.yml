name: Audit phase 1 corrections
on:
  push:
    branches: [audit-1.19.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply idempotent phase 1 corrections
        run: python scripts/audit-phase1-fixes.py
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated corrections
        run: |
          if git diff --quiet; then
            echo "No source changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.js src/gameData.js src/builtin1192.js tests/audit-land-data.test.mjs package.json DATA_AUDIT_1.19.2.md
          git commit -m "fix: certify module-slot lists and regimental categories"
          git push origin HEAD:audit-1.19.2
