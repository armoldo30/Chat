name: Launch shell hardening patcher
on:
  push:
    branches: [launch-candidate-1.19.2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-candidate-1.19.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve page shell and release language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js');s=p.read_text()
          old="document.body.innerHTML=`<div class=\"app-shell\">"
          new="$('app').innerHTML=`<div class=\"app-shell\">"
          if old not in s: raise SystemExit('body render anchor not found')
          s=s.replace(old,new,1)
          old='Newer patch data is not mixed into the 0.15.0 model.'
          new='Newer patch data is not mixed into the 0.16.0 model.'
          if old not in s: raise SystemExit('version notice anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Launch hardening regression
        run: node tests/launch-hardening.test.mjs
      - name: Full regression suite
        run: npm test
      - name: Static build
        run: npm run build
      - name: Commit shell hardening
        run: |
          if git diff --quiet -- src/main.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "fix: preserve legal shell during app renders"
          git push origin HEAD:launch-candidate-1.19.2
