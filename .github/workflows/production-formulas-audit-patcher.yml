              {id:'P-004',before:'synthetic 1% denominator let 0%-efficiency lines recover',after:'0% remains 0 rather than inventing unsupported recovery'},
              {id:'P-005',before:'production summary labeled raw unconstrained IC as effective',after:'summary sums projected line IC after efficiency, MIO and resource constraints'}
            ]
          });

          export default PRODUCTION_FORMULA_CERTIFICATION_1192;
          '''
          Path('src/builtin1192/production-formulas-certification-1192.js').write_text(cert)

          # data.js: use exact source endpoints/defaults and Production-audited executable transforms.
          p=Path('src/data.js'); s=p.read_text()
          old="import { DEFINE_VALUES_1192, PLANNER_ANALYTICAL_CONSTANTS_1192 } from './builtin1192/defines-certification-1192.js';"
          new="import { DEFINE_VALUES_1192 } from './builtin1192/defines-certification-1192.js';\nimport { PRODUCTION_SOURCE_1192, PRODUCTION_EXECUTABLE_1192 } from './builtin1192/production-formulas-certification-1192.js';"
          if old not in s: raise SystemExit('data import pattern not found')
          s=s.replace(old,new,1)
          old="""export const PRODUCTION_CONSTANTS = {
  // Formula-derived scale; exact use is certified in the Production Formulas audit, not as a literal define.
  efficiencyBaseGain: 0.001,
  resourceLackPenaltyPerUnit: Math.abs(D1192_PROD.PRODUCTION_RESOURCE_LACK_PENALTY),
  maxLineResourcePenalty: PLANNER_ANALYTICAL_CONSTANTS_1192.maxLineResourcePenalty,
  maxMilitaryFactoriesPerLine: D1192_PROD.MAX_MIL_FACTORIES_PER_LINE
};"""
          new="""const P1192=PRODUCTION_SOURCE_1192.defines;
export const PRODUCTION_CONSTANTS = {
  baseFactoryOutput: P1192.BASE_FACTORY_SPEED_MIL,
  poweredFactoryOutput: P1192.POWERED_FACTORY_SPEED_MIL,
  baseStartEfficiency: P1192.BASE_FACTORY_START_EFFICIENCY_FACTOR,
