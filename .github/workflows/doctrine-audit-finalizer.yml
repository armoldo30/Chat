name: Doctrine audit finalizer

on:
  push:
    branches: [audit-1.19.2]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
          fetch-depth: 0
      - name: Update Doctrine audit record
        run: python scripts/finalize-doctrine-audit.py
      - name: Commit audit record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DATA_AUDIT_1.19.2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: certify Doctrine 1.19.2 source and bounded runtime"
          git push origin HEAD:audit-1.19.2
