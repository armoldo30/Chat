name: MIO staged payload validation
on:
  push:
    branches: [audit-1.19.2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover nested payload prefix
        shell: python
        run: |
          import base64,lzma,re,zlib,hashlib
          from pathlib import Path
          outer=''.join(Path('.mio-stage').joinpath(p.name).read_text() for p in sorted(Path('.mio-stage').glob('part-*')))
          raw=base64.b64decode(outer + '='*((-len(outer))%4))
          dec=lzma.LZMADecompressor()
          try: wrapper=dec.decompress(raw)
          except lzma.LZMAError as e: wrapper=getattr(e,'args',()) and b'' or b''
          # Python's lzma may discard partial output on EOF errors; use xz command result generated separately below if needed.
          import subprocess
          Path('/tmp/payload.xz').write_bytes(raw)
          subprocess.run('xz -dc /tmp/payload.xz > /tmp/wrapper.py 2>/dev/null',shell=True)
          text=Path('/tmp/wrapper.py').read_text(errors='ignore')
          m=re.search(r"PAYLOAD='([^']*)",text,re.S)
          if not m: raise SystemExit('no inner payload prefix recovered')
          s=m.group(1); data=base64.b64decode(s + '='*((-len(s))%4))
          dz=zlib.decompressobj(); inner=dz.decompress(data)
          Path('/tmp/inner-prefix').write_bytes(inner)
          print('WRAPPER_BYTES',len(text),'INNER_COMPRESSED_BYTES',len(data),'INNER_RECOVERED_BYTES',len(inner),'INNER_EOF',dz.eof)
          print('INNER_SHA256',hashlib.sha256(inner).hexdigest())
          print('--- INNER HEAD ---')
          print(inner[:4000].decode(errors='replace'))
          print('--- INNER TAIL ---')
          print(inner[-12000:].decode(errors='replace'))
