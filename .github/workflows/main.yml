name: Test and Deploy War Planner
on:
  push:
    branches: [main, staging-0.15.0]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply staged 0.15.0 designer migration
        if: github.ref == 'refs/heads/staging-0.15.0'
        run: |
          if grep -q "configureTankDataPack" src/main.js; then
            echo "Designer migration already persisted."
          else
            node scripts/upgrade-015-designers.mjs
          fi
      - name: Engine tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated staging migration
        if: github.ref == 'refs/heads/staging-0.15.0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: persist validated 0.15 designer wiring"
            git push
          fi
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
