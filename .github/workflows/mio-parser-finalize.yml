name: Finalize MIO parser semantics
on:
  push:
    branches:
      - audit-1.19.2
    paths:
      - .github/workflows/mio-parser-finalize.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
      - name: Apply parser patch
        run: node scripts/mio-parser-finalize.mjs
      - name: Smoke parser
        run: node tests/mio-parser.test.mjs
      - name: Commit result
        run: |
          rm .github/workflows/mio-parser-finalize.yml scripts/mio-parser-finalize.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: parse MIO parent thresholds and trait removals"
          git push origin HEAD:audit-1.19.2
