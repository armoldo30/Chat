name: Combat formulas audit patcher

on:
  push:
    branches: [audit-1.19.2]
    paths:
      - '.github/workflows/combat-audit-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply combat audit
        run: python .combat-stage/patch.py
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit audited combat formulas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json DATA_AUDIT_1.19.2.md
          git diff --cached --check
          git commit -m "audit: certify bounded HOI4 1.19.2 combat formulas"
          git push origin HEAD:audit-1.19.2
