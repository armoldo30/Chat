name: Finalize MIO parser semantics
on:
  push:
    branches: [audit-1.19.2]
    paths: ['.github/workflows/mio-parser-finalize.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
      - name: Patch MIO parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/parser.js')
          s=p.read_text()
          old="""    return {id:token,name:String(last(raw.name)||token),equipmentBonus:plainNeed(raw.equipment_bonus),productionBonus:plainNeed(raw.production_bonus),organizationModifier:plainNeed(raw.organization_modifier),parents:items(raw.any_parent),allParents:items(raw.all_parents),mutuallyExclusive:items(raw.mutually_exclusive),equipmentTypes:items(raw.limit_to_equipment_type)};"""
          new="""    const parent=obj(last(raw.parent));
    return {id:token,name:String(last(raw.name)||token),equipmentBonus:plainNeed(raw.equipment_bonus),productionBonus:plainNeed(raw.production_bonus),organizationModifier:plainNeed(raw.organization_modifier),parents:items(raw.any_parent),allParents:items(raw.all_parents),parentTraits:items(parent.traits),parentCount:num(last(parent.num_parents_needed)),mutuallyExclusive:items(raw.mutually_exclusive),equipmentTypes:items(raw.limit_to_equipment_type)};"""
          assert old in s, 'normalizeTrait target changed'
          s=s.replace(old,new,1)
          old="""    if(!(raw.include||raw.equipment_type||raw.equipment_types||raw.initial_trait||raw.trait||raw.add_trait||raw.override_trait||raw.allowed))continue;"""
          new="""    if(!(raw.include||raw.equipment_type||raw.equipment_types||raw.initial_trait||raw.trait||raw.add_trait||raw.override_trait||raw.remove_trait||raw.allowed))continue;"""
          assert old in s, 'MIO record guard target changed'
          s=s.replace(old,new,1)
          old="""    out[id]={id,name:String(last(raw.name)||id),include:String(last(raw.include)||''),countries,equipmentTypes:[...new Set([...items(raw.equipment_type),...items(raw.equipment_types)])],initial,traits};"""
          new="""    const removeTraits=[...new Set(arrify(raw.remove_trait).flatMap(value=>{const item=last(value);if(typeof item==='string'||typeof item==='number')return [String(item)];const removal=obj(item);return [...items(removal.token),...items(removal.trait),...items(removal.traits)];}))];
    out[id]={id,name:String(last(raw.name)||id),include:String(last(raw.include)||''),countries,equipmentTypes:[...new Set([...items(raw.equipment_type),...items(raw.equipment_types)])],initial,traits,removeTraits};"""
          assert old in s, 'MIO output target changed'
          s=s.replace(old,new,1)
          old="""      traits:{...(base.traits||{}),...(raw.traits||{})}
    };
    if(raw.include&&!parent)result.inheritanceWarning=`missing-include:${raw.include}`;"""
          new="""      traits:{...(base.traits||{}),...(raw.traits||{})}
    };
    if(raw.removeTraits?.length){result.traits={...(result.traits||{})};for(const traitId of raw.removeTraits)delete result.traits[traitId];}
    delete result.removeTraits;
    if(raw.include&&!parent)result.inheritanceWarning=`missing-include:${raw.include}`;"""
          assert old in s, 'MIO resolver target changed'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Smoke parser
        run: node tests/mio-parser.test.mjs
      - name: Commit parser patch and remove helper workflow
        run: |
          rm .github/workflows/mio-parser-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/parser.js .github/workflows/mio-parser-finalize.yml
          git commit -m "fix: parse MIO parent thresholds and trait removals"
          git push origin HEAD:audit-1.19.2
