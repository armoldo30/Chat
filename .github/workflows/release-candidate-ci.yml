name: Release Candidate Validation
on:
  push:
    branches: ['launch-candidate-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify release scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scope=full
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE"
              head="$PR_HEAD"
            else
              base="$BEFORE_SHA"
              head="$CURRENT_SHA"
              if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse "$head^")"; fi
            fi
            scope="$(node scripts/classify-release-scope.mjs "$base" "$head")"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Release validation scope: $scope"
      - name: Fast presentation regression suite
        if: steps.scope.outputs.scope == 'fast'
        run: npm run test:visual
      - name: Full certified regression suite
        if: steps.scope.outputs.scope != 'fast'
        run: npm test
      - name: Confirm full 160k Gauntlet matrix
        if: steps.scope.outputs.scope != 'fast'
        run: node tests/gauntlet-full-smoke.test.mjs
      - name: Build static site
        run: npm run build
      - name: Verify release surface
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/privacy.html
          test -f dist/ads.txt
          test -f dist/robots.txt
          test -f dist/src/gauntlet.js
          test -f dist/src/gauntlet-ui.js
          test -f dist/src/gauntlet.css
          VERSION="$(node -p "require('./package.json').version")"
          grep -Fq "appVersion: '$VERSION'" dist/src/data.js
          grep -q "enabled:false" dist/src/ad-config.js
          grep -q "Division Gauntlet" dist/src/main.js
          test ! -e .mio-stage
          test ! -e .github/workflows/launch-hardening-patcher.yml
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Refs(HTMLParser):
              def __init__(self): super().__init__(); self.refs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  for key in ('href','src'):
                      v=a.get(key,'')
                      if v.startswith('./'): self.refs.append(v[2:].split('?',1)[0].split('#',1)[0])
          p=Refs();p.feed(Path('dist/index.html').read_text())
          missing=[r for r in p.refs if r and not Path('dist',r).exists()]
          if missing: raise SystemExit(f'missing built references: {missing}')
          print('Built local references:',len(p.refs))
          PY
          git diff --exit-code
      - name: Fast presentation browser smoke
        if: steps.scope.outputs.scope == 'fast'
        run: bash scripts/served-browser-smoke-fast.sh dist
      - name: Full served browser route and accessibility smoke
        if: steps.scope.outputs.scope != 'fast'
        run: bash scripts/served-browser-smoke.sh dist
