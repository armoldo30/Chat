name: Bootstrap 0.14.0
on:
  push:
    branches: [bootstrap-0.14.0]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct and validate release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.tar.gz
          echo "272afe8776711f4bb2d42682746e974719f7449cbe6adf9996cd6eb623ad160d  /tmp/release.tar.gz" | sha256sum -c -
          mkdir /tmp/release
          tar -xzf /tmp/release.tar.gz -C /tmp/release
          cd /tmp/release
          npm test
          npm run build
      - name: Promote 0.14.0 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release/. .
          # Preserve the currently deployed GitHub Pages workflow exactly.
          git checkout origin/main -- .github/workflows/main.yml
          git add -A
          git commit -m "release: update HOI4 War Planner to 0.14.0"
          git push origin main
