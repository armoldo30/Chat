name: MIO Visual Integrity Check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify complete MIO visual trees
        run: |
          ! grep -q 'traits||{}).slice(0,24)' src/main.js
          node tests/mio-tree-visual.test.mjs
          node tests/visual-boards.test.mjs
