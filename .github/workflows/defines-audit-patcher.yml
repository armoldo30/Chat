name: Defines Audit Patcher

on:
  push:
    branches: [audit-1.19.2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact 1.19.2 Defines certification patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cert = r'''export const DEFINE_VALUES_1192={
            NMilitary:{
              BASE_CHANCE_TO_AVOID_HIT:90,
              CHANCE_TO_AVOID_HIT_AT_NO_DEF:60,
              COMBAT_OVER_WIDTH_PENALTY:-1,
              COMBAT_OVER_WIDTH_PENALTY_MAX:-0.33,
              COMBAT_STACKING_START:5,
              COMBAT_STACKING_EXTRA:3,
              COMBAT_STACKING_PENALTY:-0.02,
              BASE_FORT_PENALTY:-0.15,
              DIG_IN_FACTOR:0.02,
              ENEMY_AIR_SUPERIORITY_IMPACT:-0.35,
              BASE_NIGHT_ATTACK_PENALTY:-0.50,
              LAND_COMBAT_ORG_DAMAGE_MODIFIER:0.053,
              LAND_COMBAT_STR_DAMAGE_MODIFIER:0.060,
              LAND_COMBAT_ORG_DICE_SIZE:4,
              LAND_COMBAT_ORG_ARMOR_ON_SOFT_DICE_SIZE:6,
              LAND_COMBAT_STR_DICE_SIZE:2,
              COMBAT_MINIMUM_TIME:4,
              EQUIPMENT_COMBAT_LOSS_FACTOR:0.70,
              ARMOR_VS_AVERAGE:0.40,
              PEN_VS_AVERAGE:0.40
            },
            NProduction:{
              BASE_FACTORY_EFFICIENCY_GAIN:1,
              PRODUCTION_RESOURCE_LACK_PENALTY:-0.05,
              MAX_MIL_FACTORIES_PER_LINE:150
            }
          };

          export const PLANNER_ANALYTICAL_CONSTANTS_1192={
            maxLineResourcePenalty:0.90
          };

          export const DEFINES_SOURCE_1192={
            gameVersion:'1.19.2',
            retainedSource:'HOI4-War-Planner-0.15.0-HANDOFF.zip/game-source/common/defines',
            sourceFiles:[
              {path:'common/defines/00_defines.lua',bytes:405669,sha256:'405a24ce579815443cafe052cff1361e20c712ca8182e3f10ccbf45330dd4be4',root:'NDefines',namespaceCount:28,directAssignments:3230,recursiveScalarLeaves:3848},
              {path:'common/defines/00_graphics.lua',bytes:89354,sha256:'dfdab0a5fad7319d7b5ac524d98af49d3a0c1f95772e6b7a76abce54836f3d86',root:'NDefines_Graphics',namespaceCount:9,directAssignments:1252,recursiveScalarLeaves:2128},
              {path:'common/defines/01_career_profile.lua',bytes:3101,sha256:'49a3c68dde41a092b1af94674db6369a7abcfc0445153bb9da248cdb3f5c8604',root:'NDefines_CareerProfile',namespaceCount:2,directAssignments:21,recursiveScalarLeaves:21}
            ],
            totalBytes:498124,
            namespaceCount:39,
            directAssignmentCount:4503,
            recursiveScalarLeafCount:5997,
            directValueTypes:{number:4124,boolean:42,string:22,table:315},
            duplicateAssignments:2,
            duplicateEffectiveValueChanges:0,
            duplicateDetails:[
              {namespace:'NMapIcons',key:'DEFAULT_PRIORITY_NAVAL_ACCIDENTS',value:13,occurrences:2},
              {namespace:'NMapIcons',key:'OPERATIVES_PRIORITY_NAVAL_ACCIDENTS',value:13,occurrences:2}
            ]
          };

          export const DEFINES_CERTIFICATION_1192={
            gameVersion:'1.19.2',
            classification:'game-file-exact-consumed-defines',
            sourceBoundary:{
              authoritativeRawGameDefinesRetained:true,
              fullDefinesCorpusCensused:true,
              plannerConsumedSourceDefineValues:23,
              plannerAnalyticalConstants:1,
              note:'The preserved 1.19.2 handoff contains the authoritative common/defines corpus. Planner-consumed game-file values below are exact extractions from that corpus; executable transformations and planner-only constants remain separately classified.'
            },
            corrections:[
              {runtime:'COMBAT_CONSTANTS.nightAttackPenalty',before:0.75,after:0.50,source:'NMilitary.BASE_NIGHT_ATTACK_PENALTY'},
              {runtime:'COMBAT_CONSTANTS.stackingLimitBase',before:8,after:5,source:'NMilitary.COMBAT_STACKING_START'},
              {runtime:'COMBAT_CONSTANTS.stackingLimitPerDirection',before:4,after:3,source:'NMilitary.COMBAT_STACKING_EXTRA'},
              {runtime:'COMBAT_CONSTANTS.orgDamageModifier',before:0.05,after:0.053,source:'NMilitary.LAND_COMBAT_ORG_DAMAGE_MODIFIER'},
              {runtime:'COMBAT_CONSTANTS.strengthDamageModifier',before:0.05,after:0.060,source:'NMilitary.LAND_COMBAT_STR_DAMAGE_MODIFIER'}
            ],
            provenanceCorrections:[
              {runtime:'PRODUCTION_CONSTANTS.maxLineResourcePenalty',value:0.90,previousClaim:'NProduction.MAX_LINE_RESOURCE_PENALTY = 90',classification:'planner-analytical',reason:'No MAX_LINE_RESOURCE_PENALTY assignment exists anywhere in the retained 1.19.2 common/defines corpus.'}
            ],
            formulaDerived:{
              'PRODUCTION_CONSTANTS.efficiencyBaseGain':{runtimeValue:0.001,sourceDefine:'NProduction.BASE_FACTORY_EFFICIENCY_GAIN',sourceValue:1,classification:'executable-inferred',deferredTo:'Production formulas',note:'0.001 is the planner runtime scale applied to the exact source value; the executable production formula remains deferred.'}
            },
            formulaDeferred:[
              'piercingDamageFactor thresholds and partial-piercing damage factors',
              'supplyModifier interpolation',
              'planning multiplier/cap',
              'CAS land-combat multiplier',
              '168-hour simulation safety horizon',
              'exact define interaction/order inside combat and production formulas'
            ]
          };

          export default DEFINES_CERTIFICATION_1192;
          '''
          Path('src/builtin1192/defines-certification-1192.js').write_text(cert)

          p=Path('src/data.js')
          s=p.read_text()
          s=s.replace("import { DEFINE_VALUES_1192 } from './builtin1192/defines-certification-1192.js';", "import { DEFINE_VALUES_1192, PLANNER_ANALYTICAL_CONSTANTS_1192 } from './builtin1192/defines-certification-1192.js';")
          s=s.replace("  maxLineResourcePenalty: Math.abs(D1192_PROD.MAX_LINE_RESOURCE_PENALTY)/100,", "  maxLineResourcePenalty: PLANNER_ANALYTICAL_CONSTANTS_1192.maxLineResourcePenalty,")
          p.write_text(s)

          p=Path('src/builtin1192.js')
          s=p.read_text()
          s=s.replace("  // The compact bundle predates the Defines audit and contains stale values for some\n  // planner-consumed keys. The audited overlay is authoritative for this bounded map,\n  // so it must replace—not merely fill missing—bundled values.\n", "  // Overlay every planner-consumed game-file-exact value from the retained 1.19.2\n  // common/defines source so stale compact values cannot survive.\n")
          s=s.replace("BUILTIN_1192.meta={...(BUILTIN_1192.meta||{}),definesCertification:'bounded-corroborated-source',plannerConsumedDefineCount:24};", "BUILTIN_1192.meta={...(BUILTIN_1192.meta||{}),definesCertification:'game-file-exact-consumed-defines',plannerConsumedDefineCount:23,plannerAnalyticalDefineCount:1,definesSourceSha256:'405a24ce579815443cafe052cff1361e20c712ca8182e3f10ccbf45330dd4be4'};")
          p.write_text(s)

          parser=Path('src/parser.js')
          s=parser.read_text()
          start=s.index('export function parseDefinesLua(text){')
          end=s.index('\nfunction obj',start)
          replacement=r'''function stripLuaComments(text){
            let out='',quote=null,escaped=false;
            for(let i=0;i<String(text||'').length;i++){
              const c=text[i],n=text[i+1];
              if(quote){out+=c;if(escaped)escaped=false;else if(c==='\\')escaped=true;else if(c===quote)quote=null;continue;}
              if(c==='"'||c==="'"){quote=c;out+=c;continue;}
              if(c==='-'&&n==='-'){while(i<text.length&&text[i]!=='\n')i++;out+='\n';continue;}
              out+=c;
            }
            return out;
          }

          function parseLuaDefineValue(source,start){
            let i=start;
            const ws=()=>{while(i<source.length&&/[\s,;]/.test(source[i]))i++;};
            const atom=()=>{
              ws();
              if(source[i]==='{')return table();
              if(source[i]==='"'||source[i]==="'"){
                const quote=source[i++];let value='',escaped=false;
                while(i<source.length){const c=source[i++];if(escaped){value+=c;escaped=false;continue;}if(c==='\\'){escaped=true;continue;}if(c===quote)break;value+=c;}
                return value;
              }
              const rest=source.slice(i),numMatch=rest.match(/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?/);
              if(numMatch){i+=numMatch[0].length;return Number(numMatch[0]);}
              const id=rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
              if(id){i+=id[0].length;if(id[0]==='true')return true;if(id[0]==='false')return false;return id[0];}
              return undefined;
            };
            const table=()=>{
              i++;const keyed={},positional=[];let hasKeys=false;ws();
              while(i<source.length&&source[i]!=='}'){
                const checkpoint=i;
                const keyMatch=source.slice(i).match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=/);
                if(keyMatch){hasKeys=true;i+=keyMatch[0].length;keyed[keyMatch[1]]=atom();}
                else{i=checkpoint;const value=atom();if(value!==undefined)positional.push(value);else i++;}
                ws();
              }
              if(source[i]==='}')i++;
              if(!hasKeys)return positional;
              if(positional.length)keyed.__items=positional;
              return keyed;
            };
            const value=atom();return {value,end:i};
          }

          function parseDefinesLuaDocument(text){
            const source=stripLuaComments(text),values={},assignments=[];
            const assign=/\b(NDefines(?:_[A-Za-z0-9_]+)?(?:\.[A-Za-z_][A-Za-z0-9_]*){0,2})\s*=/g;
            let match,order=0;
            while((match=assign.exec(source))){
              const parsed=parseLuaDefineValue(source,assign.lastIndex);if(parsed.value===undefined)continue;
              const parts=match[1].split('.'),value=parsed.value;assign.lastIndex=parsed.end;
              if(parts.length===1&&value&&typeof value==='object'&&!Array.isArray(value)){
                for(const [namespace,namespaceValues] of Object.entries(value)){
                  if(namespace==='__items'||!namespaceValues||typeof namespaceValues!=='object'||Array.isArray(namespaceValues))continue;
                  const target=values[namespace]||(values[namespace]={});
                  for(const [key,item] of Object.entries(namespaceValues)){
                    if(key==='__items')continue;target[key]=item;assignments.push({namespace,key,value:item,order:++order,root:parts[0]});
                  }
                }
              }else if(parts.length===2&&value&&typeof value==='object'&&!Array.isArray(value)){
                const namespace=parts[1],target=values[namespace]||(values[namespace]={});
                for(const [key,item] of Object.entries(value)){if(key==='__items')continue;target[key]=item;assignments.push({namespace,key,value:item,order:++order,root:parts[0]});}
              }else if(parts.length===3){
                const namespace=parts[1],key=parts[2];(values[namespace]||(values[namespace]={}))[key]=value;assignments.push({namespace,key,value,order:++order,root:parts[0]});
              }
            }
            return {values,assignments};
          }

          export function parseDefinesLua(text){return parseDefinesLuaDocument(text).values;}
          export function parseDefinesLuaAssignments(text){return parseDefinesLuaDocument(text).assignments;}
          '''
          s=s[:start]+replacement+s[end:]

          old="""    meta:{format:1,createdAt:new Date().toISOString(),sourceFiles:0,unitFiles:0,equipmentFiles:0,defineFiles:0,terrainFiles:0,technologyFiles:0,moduleFiles:0,mioFiles:0,warnings:[]},\n    defines:{},subUnits:{},equipment:{},duplicateArchetypes:{},modules:{},mios:{},terrain:{},technologyFiles:[]\n  };\n  for(const file of Array.from(files||[])){"""
          new="""    meta:{format:1,createdAt:new Date().toISOString(),sourceFiles:0,unitFiles:0,equipmentFiles:0,defineFiles:0,terrainFiles:0,technologyFiles:0,moduleFiles:0,mioFiles:0,warnings:[]},\n    defines:{},defineProvenance:{},subUnits:{},equipment:{},duplicateArchetypes:{},modules:{},mios:{},terrain:{},technologyFiles:[]\n  };\n  let defineAssignmentOrder=0;\n  for(const file of Array.from(files||[])){"""
          if old not in s: raise SystemExit('buildDataPack initializer block not found')
          s=s.replace(old,new)
          old="if(path.includes('/defines/')||path.includes('defines')||/(?:NDefines\\.)?N[A-Za-z_][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*\\s*=/.test(text)){mergeDefines(pack.defines,parseDefinesLua(text));pack.meta.defineFiles++;continue;}"
          new="""if(path.includes('/defines/')||path.includes('defines')||/(?:NDefines\\.)?N[A-Za-z_][A-Za-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*\\s*=/.test(text)){\n        const parsedDefines=parseDefinesLua(text),sourceFile=file.webkitRelativePath||file.name;\n        for(const [namespace,values] of Object.entries(parsedDefines)){\n          const target=pack.defines[namespace]||(pack.defines[namespace]={});\n          for(const [key,value] of Object.entries(values)){\n            target[key]=value;\n            const id=`${namespace}.${key}`;\n            (pack.defineProvenance[id]||(pack.defineProvenance[id]=[])).push({namespace,key,value:cloneRecord(value),sourceFile,assignmentOrder:++defineAssignmentOrder});\n          }\n        }\n        pack.meta.defineFiles++;continue;\n      }"""
          if old not in s: raise SystemExit('define build branch not found')
          s=s.replace(old,new)
          old="materializeDuplicateArchetypes(pack.equipment,pack.duplicateArchetypes);pack.mios=resolveMIOs(pack.mios);pack.meta.duplicateArchetypeCount=Object.keys(pack.duplicateArchetypes).length;pack.meta.subUnitCount=Object.keys(pack.subUnits).length;pack.meta.equipmentCount=Object.keys(pack.equipment).length;pack.meta.moduleCount=Object.keys(pack.modules).length;pack.meta.mioCount=Object.keys(pack.mios).length;pack.meta.terrainCount=Object.keys(pack.terrain).length;"
          new="materializeDuplicateArchetypes(pack.equipment,pack.duplicateArchetypes);pack.mios=resolveMIOs(pack.mios);pack.meta.duplicateArchetypeCount=Object.keys(pack.duplicateArchetypes).length;pack.meta.subUnitCount=Object.keys(pack.subUnits).length;pack.meta.equipmentCount=Object.keys(pack.equipment).length;pack.meta.moduleCount=Object.keys(pack.modules).length;pack.meta.mioCount=Object.keys(pack.mios).length;pack.meta.terrainCount=Object.keys(pack.terrain).length;pack.meta.defineNamespaceCount=Object.keys(pack.defines).length;pack.meta.defineValueCount=Object.values(pack.defines).reduce((n,values)=>n+Object.keys(values||{}).length,0);"
          if old not in s: raise SystemExit('buildDataPack summary block not found')
          s=s.replace(old,new)
          s=s.replace("  const m=pack?.defines?.NMilitary||pack?.defines?.NProduction||{};let combatCount=0,productionCount=0;", "  let combatCount=0,productionCount=0;")
          old="""  combatCount+=set(combat,'combatMinimumHours',mil.COMBAT_MINIMUM_TIME);\n  combatCount+=set(combat,'equipmentCombatLossFactor',mil.EQUIPMENT_COMBAT_LOSS_FACTOR);\n  const prod=pack?.defines?.NProduction||pack?.defines?.NMilitary||{};\n  if(Number.isFinite(prod.PRODUCTION_RESOURCE_LACK_PENALTY)){production.resourceLackPenaltyPerUnit=Math.abs(prod.PRODUCTION_RESOURCE_LACK_PENALTY);productionCount++;}\n  if(Number.isFinite(prod.MAX_LINE_RESOURCE_PENALTY)){production.maxLineResourcePenalty=Math.abs(prod.MAX_LINE_RESOURCE_PENALTY)>1?Math.abs(prod.MAX_LINE_RESOURCE_PENALTY)/100:Math.abs(prod.MAX_LINE_RESOURCE_PENALTY);productionCount++;}\n  productionCount+=set(production,'maxMilitaryFactoriesPerLine',prod.MAX_MIL_FACTORIES_PER_LINE);"""
          new="""  combatCount+=set(combat,'combatMinimumHours',mil.COMBAT_MINIMUM_TIME);\n  combatCount+=set(combat,'equipmentCombatLossFactor',mil.EQUIPMENT_COMBAT_LOSS_FACTOR);\n  if(Number.isFinite(mil.ARMOR_VS_AVERAGE)){combat.armorWeights={max:mil.ARMOR_VS_AVERAGE,average:1-mil.ARMOR_VS_AVERAGE};combatCount++;}\n  if(Number.isFinite(mil.PEN_VS_AVERAGE)){combat.piercingWeights={max:mil.PEN_VS_AVERAGE,average:1-mil.PEN_VS_AVERAGE};combatCount++;}\n  const prod=pack?.defines?.NProduction||{};\n  if(Number.isFinite(prod.BASE_FACTORY_EFFICIENCY_GAIN)){production.efficiencyBaseGain=prod.BASE_FACTORY_EFFICIENCY_GAIN*.001;productionCount++;}\n  if(Number.isFinite(prod.PRODUCTION_RESOURCE_LACK_PENALTY)){production.resourceLackPenaltyPerUnit=Math.abs(prod.PRODUCTION_RESOURCE_LACK_PENALTY);productionCount++;}\n  productionCount+=set(production,'maxMilitaryFactoriesPerLine',prod.MAX_MIL_FACTORIES_PER_LINE);"""
          if old not in s: raise SystemExit('defineOverrides tail block not found')
          s=s.replace(old,new)
          parser.write_text(s)

          parser_test=r'''import assert from 'node:assert/strict';
          import { parseDefinesLua, parseDefinesLuaAssignments, buildDataPack, defineOverrides } from '../src/parser.js';

          const nested=`NDefines = {
           NMilitary = {
            BASE_CHANCE_TO_AVOID_HIT = 90,
            CHANCE_TO_AVOID_HIT_AT_NO_DEF = 60,
            BASE_NIGHT_ATTACK_PENALTY = -0.5,
            TEST_BOOL = true,
            TEST_STRING = "source-string",
            TEST_ARRAY = { 1, 2.5, -3 },
           }
           NProduction = {
            BASE_FACTORY_EFFICIENCY_GAIN = 1,
            MAX_MIL_FACTORIES_PER_LINE = 150,
           }
          }`;
          const parsed=parseDefinesLua(nested);
          assert.equal(parsed.NMilitary.BASE_CHANCE_TO_AVOID_HIT,90);
          assert.equal(parsed.NMilitary.CHANCE_TO_AVOID_HIT_AT_NO_DEF,60);
          assert.equal(parsed.NMilitary.BASE_NIGHT_ATTACK_PENALTY,-.5);
          assert.equal(parsed.NMilitary.TEST_BOOL,true);
          assert.equal(parsed.NMilitary.TEST_STRING,'source-string');
          assert.deepEqual(parsed.NMilitary.TEST_ARRAY,[1,2.5,-3]);
          assert.equal(parsed.NProduction.MAX_MIL_FACTORIES_PER_LINE,150);

          const graphics=`NDefines_Graphics = { NMapMode = { TEST_STRING = "graphics" TEST_ARRAY = { 4, 5 } } }`;
          assert.equal(parseDefinesLua(graphics).NMapMode.TEST_STRING,'graphics');
          assert.deepEqual(parseDefinesLua(graphics).NMapMode.TEST_ARRAY,[4,5]);

          const dotted=`-- override style
          NDefines.NMilitary.BASE_NIGHT_ATTACK_PENALTY = -0.50 -- inline comment
          NDefines.NMilitary.COMBAT_OVER_WIDTH_PENALTY = -1
          NDefines.NMilitary.COMBAT_OVER_WIDTH_PENALTY_MAX = -0.33
          NDefines.NProduction.PRODUCTION_RESOURCE_LACK_PENALTY = -0.05
          NDefines.NMilitary.TEST_ARRAY = { 9, 10 }
          `;
          const overrides=parseDefinesLua(dotted);
          assert.equal(overrides.NMilitary.COMBAT_OVER_WIDTH_PENALTY,-1);
          assert.equal(overrides.NMilitary.COMBAT_OVER_WIDTH_PENALTY_MAX,-.33);
          assert.equal(overrides.NProduction.PRODUCTION_RESOURCE_LACK_PENALTY,-.05);
          assert.deepEqual(overrides.NMilitary.TEST_ARRAY,[9,10]);
          assert.ok(parseDefinesLuaAssignments(dotted).every((item,index)=>item.order===index+1));

          const fake=(name,path,text)=>({name,webkitRelativePath:path,text:async()=>text});
          const pack=await buildDataPack([
           fake('00_defines.lua','common/defines/00_defines.lua',nested),
           fake('zz_override.lua','common/defines/zz_override.lua',dotted)
          ]);
          assert.equal(pack.meta.defineFiles,2,'both define files must be inventoried');
          assert.equal(pack.defines.NMilitary.BASE_NIGHT_ATTACK_PENALTY,-.5,'later define files must override earlier values');
          assert.equal(pack.defines.NProduction.MAX_MIL_FACTORIES_PER_LINE,150);
          assert.equal(pack.defineProvenance['NMilitary.BASE_NIGHT_ATTACK_PENALTY'].length,2,'override provenance must retain both source-file observations');
          assert.equal(pack.defineProvenance['NMilitary.BASE_NIGHT_ATTACK_PENALTY'].at(-1).sourceFile,'common/defines/zz_override.lua');
          assert.ok(pack.defineProvenance['NMilitary.BASE_NIGHT_ATTACK_PENALTY'].at(-1).assignmentOrder>pack.defineProvenance['NMilitary.BASE_NIGHT_ATTACK_PENALTY'][0].assignmentOrder);

          const combat={armorWeights:{max:.1,average:.9},piercingWeights:{max:.1,average:.9}},production={maxLineResourcePenalty:.9};
          const mapped={defines:{NMilitary:{
           BASE_CHANCE_TO_AVOID_HIT:90,CHANCE_TO_AVOID_HIT_AT_NO_DEF:60,
           COMBAT_OVER_WIDTH_PENALTY:-1,COMBAT_OVER_WIDTH_PENALTY_MAX:-.33,
           COMBAT_STACKING_START:5,COMBAT_STACKING_EXTRA:3,COMBAT_STACKING_PENALTY:-.02,
           BASE_FORT_PENALTY:-.15,DIG_IN_FACTOR:.02,ENEMY_AIR_SUPERIORITY_IMPACT:-.35,BASE_NIGHT_ATTACK_PENALTY:-.5,
           LAND_COMBAT_ORG_DICE_SIZE:4,LAND_COMBAT_ORG_ARMOR_ON_SOFT_DICE_SIZE:6,LAND_COMBAT_STR_DICE_SIZE:2,
           LAND_COMBAT_ORG_DAMAGE_MODIFIER:.053,LAND_COMBAT_STR_DAMAGE_MODIFIER:.060,COMBAT_MINIMUM_TIME:4,EQUIPMENT_COMBAT_LOSS_FACTOR:.7,
           ARMOR_VS_AVERAGE:.4,PEN_VS_AVERAGE:.4
          },NProduction:{BASE_FACTORY_EFFICIENCY_GAIN:1,PRODUCTION_RESOURCE_LACK_PENALTY:-.05,MAX_MIL_FACTORIES_PER_LINE:150}}};
          const result=defineOverrides(mapped,combat,production);
          assert.equal(result.combatCount,20,'all 20 planner-consumed source-exact military defines must map');
          assert.equal(result.productionCount,3,'two direct production values plus the explicitly inferred efficiency scale must map');
          assert.ok(Math.abs(combat.defendedHitChance-.1)<1e-12);
          assert.ok(Math.abs(combat.undefendedHitChance-.4)<1e-12);
          assert.equal(combat.nightAttackPenalty,.5);
          assert.deepEqual(combat.armorWeights,{max:.4,average:.6});
          assert.deepEqual(combat.piercingWeights,{max:.4,average:.6});
          assert.equal(production.efficiencyBaseGain,.001);
          assert.equal(production.resourceLackPenaltyPerUnit,.05);
          assert.equal(production.maxLineResourcePenalty,.9,'planner analytical resource cap is not overwritten by a nonexistent 1.19.2 source key');
          assert.equal(production.maxMilitaryFactoriesPerLine,150);
          console.log('Defines parser/mapping certification passed.');
          '''
          Path('tests/defines-parser-certification.test.mjs').write_text(parser_test)

          runtime_test=r'''import assert from 'node:assert/strict';
          import BUILTIN_1192 from '../src/builtin1192.js';
          import { COMBAT_CONSTANTS, PRODUCTION_CONSTANTS, battalions, supports, terrain } from '../src/data.js';
          import { calcDivision, aggregateDivision, battleContext } from '../src/engine.js';
          import { DEFINE_VALUES_1192, PLANNER_ANALYTICAL_CONSTANTS_1192 } from '../src/builtin1192/defines-certification-1192.js';

          const mil=DEFINE_VALUES_1192.NMilitary,prod=DEFINE_VALUES_1192.NProduction;
          assert.equal(COMBAT_CONSTANTS.defendedHitChance,1-mil.BASE_CHANCE_TO_AVOID_HIT/100);
          assert.equal(COMBAT_CONSTANTS.undefendedHitChance,1-mil.CHANCE_TO_AVOID_HIT_AT_NO_DEF/100);
          assert.equal(COMBAT_CONSTANTS.overWidthPenaltyCap,Math.abs(mil.COMBAT_OVER_WIDTH_PENALTY_MAX));
          assert.equal(COMBAT_CONSTANTS.overWidthPenaltyMultiplier,Math.abs(mil.COMBAT_OVER_WIDTH_PENALTY));
