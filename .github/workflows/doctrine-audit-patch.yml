name: Doctrine audit patch helper

on:
  push:
    branches: [audit-1.19.2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
          fetch-depth: 0
      - name: Apply doctrine audit fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          doctrine = Path('src/doctrine.js')
          text = doctrine.read_text()
          old = "supply_consumption:['supply','mult']"
          new = "supply_consumption:['supply','flat']"
          if old not in text and new not in text:
              raise SystemExit('doctrine supply mapping anchor missing')
          text = text.replace(old, new)
          doctrine.write_text(text)

          parser = Path('src/gameDataParser.js')
          text = parser.read_text()
          start = text.index('// HOI4 1.19 uses common/doctrines/{grand_doctrines,tracks,subdoctrines} rather than the old technology-shaped doctrine tree.')
          end = text.index('export async function buildExtendedDataPack(files){', start)
          replacement = '''// HOI4 1.19 uses common/doctrines/{grand_doctrines,tracks,subdoctrines} rather than the old technology-shaped doctrine tree.
          function doctrineGateTokens(raw){
            return [...new Set([...prerequisiteTokens(raw?.available),...prerequisiteTokens(raw?.visible),...prerequisiteTokens(raw?.allowed)])];
          }
          export function extractDoctrines(parsed,kind='unknown',sourceFile=''){
            const out={};
            for(const [id,raw0] of entries(parsed)){
              if(String(id).startsWith('@'))continue;
              const raw=isObj(last(raw0))?last(raw0):{};
              if(!Object.keys(raw).length)continue;
              const xor=items(raw.xor);
              out[id]={id,kind,sourceFile:String(sourceFile||''),folder:last(raw.folder),track:last(raw.track),tracks:items(raw.tracks),xpCost:num(raw.xp_cost),xor,
                requirements:{available:raw.available===undefined?null:clean(raw.available),visible:raw.visible===undefined?null:clean(raw.visible),allowed:raw.allowed===undefined?null:clean(raw.allowed),xor:[...xor]},
                prerequisites:doctrineGateTokens(raw),raw:clean(raw)};
            }
            return out;
          }

          export function extractDoctrineMetadata(parsed,sourceFile=''){
            const out={};
            for(const [id,raw0] of entries(parsed)){
              if(String(id).startsWith('@'))continue;
              const raw=isObj(last(raw0))?last(raw0):{};
              if(!Object.keys(raw).length)continue;
              out[id]={id,kind:'metadata',sourceFile:String(sourceFile||''),raw:clean(raw)};
            }
            return out;
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('pack.equipmentUpgrades=pack.equipmentUpgrades||{};pack.doctrines=pack.doctrines||{};', 'pack.equipmentUpgrades=pack.equipmentUpgrades||{};pack.doctrines=pack.doctrines||{};pack.doctrineMetadata=pack.doctrineMetadata||{};')
          text = text.replace("merge(pack.doctrines,extractDoctrines(parsed,'grand'))", "merge(pack.doctrines,extractDoctrines(parsed,'grand',sourceFile))")
          text = text.replace("merge(pack.doctrines,extractDoctrines(parsed,'track'))", "merge(pack.doctrines,extractDoctrines(parsed,'track',sourceFile))")
          text = text.replace("merge(pack.doctrines,extractDoctrines(parsed,'subdoctrine'))", "merge(pack.doctrines,extractDoctrines(parsed,'subdoctrine',sourceFile))")
          text = text.replace("else if(path.includes('/doctrine'))merge(pack.doctrines,extractDoctrines(parsed,'legacy'));", "else if(path.includes('/doctrine'))merge(pack.doctrineMetadata,extractDoctrineMetadata(parsed,sourceFile));")
          text = text.replace('doctrineCount:Object.keys(pack.doctrines).length,parserVersion:', 'doctrineCount:Object.keys(pack.doctrines).length,doctrineMetadataCount:Object.keys(pack.doctrineMetadata).length,parserVersion:')
          parser.write_text(text)

          builtin = Path('src/builtin1192.js')
          text = builtin.read_text()
          anchor = "const BUILTIN_1192=JSON.parse(text);\n"
          if 'bundledDoctrineMetadata' not in text:
              migration = anchor + "const bundledDoctrineMetadata={};\nfor(const [id,record] of Object.entries(BUILTIN_1192.doctrines||{}))if(record?.kind==='legacy'){bundledDoctrineMetadata[id]={...record,kind:'metadata'};delete BUILTIN_1192.doctrines[id];}\nBUILTIN_1192.doctrineMetadata={...(BUILTIN_1192.doctrineMetadata||{}),...bundledDoctrineMetadata};\n"
              if anchor not in text: raise SystemExit('builtin doctrine migration anchor missing')
              text = text.replace(anchor, migration, 1)
          if 'doctrineNodeCatalogSeparated:true' not in text:
              end_anchor = 'export default BUILTIN_1192;'
              meta = "BUILTIN_1192.meta={...(BUILTIN_1192.meta||{}),doctrineCount:Object.keys(BUILTIN_1192.doctrines||{}).length,doctrineMetadataCount:Object.keys(BUILTIN_1192.doctrineMetadata||{}).length,doctrineNodeCatalogSeparated:true};\n" + end_anchor
              if end_anchor not in text: raise SystemExit('builtin export anchor missing')
              text = text.replace(end_anchor, meta, 1)
          builtin.write_text(text)
      - name: Commit doctrine fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doctrine.js src/gameDataParser.js src/builtin1192.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: doctrine source runtime and parser boundaries"
          git push origin HEAD:audit-1.19.2
