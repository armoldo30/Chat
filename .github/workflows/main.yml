name: Test and Deploy War Planner
on:
  push:
    branches: [main, staging-0.15.0, audit-1.19.2]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-defines-audit:
    if: github.ref == 'refs/heads/audit-1.19.2' && github.event.head_commit.message == 'chore: run defines integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-1.19.2
          fetch-depth: 0
      - name: Apply Defines audit patch
        run: python3 scripts/apply-defines-audit.py
      - name: Restore normal workflow and commit
        run: |
          git checkout HEAD^ -- .github/workflows/main.yml
          git rm .github/workflows/defines-audit-apply.yml scripts/apply-defines-audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.js src/parser.js src/builtin1192.js package.json .github/workflows/main.yml
          git commit -m "audit: integrate bounded 1.19.2 defines"
          git push origin HEAD:audit-1.19.2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
