name: Audit parser list fix
on:
  push:
    branches: [audit-1.19.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply idempotent list-parser fix
        run: python scripts/audit-fix-list-parsing.py
      - name: Test
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Persist validated audit fix
        run: |
          if git diff --quiet; then
            echo "No parser changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.js src/gameDataParser.js tests/parser-list-values.test.mjs package.json
          git commit -m "fix: preserve Clausewitz multi-value lists"
          git push origin HEAD:audit-1.19.2
