name: Test and Deploy War Planner
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify release scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scope=full
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
            if [[ "$base" =~ ^0+$ ]]; then base="$(git rev-parse "$head^")"; fi
            scope="$(node scripts/classify-release-scope.mjs "$base" "$head")"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Production validation scope: $scope"
      - name: Fast presentation regression suite
        if: steps.scope.outputs.scope == 'fast'
        run: npm run test:visual
      - name: Full certified regression suite
        if: steps.scope.outputs.scope != 'fast'
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Fast presentation browser smoke
        if: steps.scope.outputs.scope == 'fast'
        run: bash scripts/served-browser-smoke-fast.sh dist
      - name: Full served browser route and accessibility smoke
        if: steps.scope.outputs.scope != 'fast'
        run: bash scripts/served-browser-smoke.sh dist
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
