name: Visual Full CI
on:
  push:
    branches: [ui-visual-overhaul-1.19.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Full certified tests
        run: npm test
      - name: Localization display tests
        run: node tests/ui-localization.test.mjs
      - name: Display label coverage
        run: node tests/display-label-coverage.test.mjs
      - name: Visual board tests
        run: node tests/visual-boards.test.mjs
      - name: Source-backed MIO tree tests
        run: node tests/mio-tree-visual.test.mjs
      - name: Primary system UI tests
        run: node tests/system-primary-ui.test.mjs
      - name: Picture-first control tests
        run: node tests/quick-controls.test.mjs
      - name: Navigation visual tests
        run: node tests/nav-visuals.test.mjs
      - name: Battle report visual tests
        run: node tests/battle-report-visuals.test.mjs
      - name: Build static site
        run: npm run build
      - name: Browser runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4173 --directory dist >/tmp/war-planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          render_route() {
            local route="$1"
            local expected="$2"
            timeout 30s "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:4173/#${route}" >"/tmp/${route}.html"
            grep -Fq "$expected" "/tmp/${route}.html"
          }
          render_route battle "Division Lab"
          render_route tank "Tank Designer"
          render_route air "Air Lab"
          render_route production "What Should I Build?"
          render_route data "Data Packs"
